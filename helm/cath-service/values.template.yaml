# Base values template for production-like environments (aat, demo, ithc, perftest)
# Database and cache infrastructure is managed by Terraform, not Helm
#
# This is deliberately ONE template for every non-preview environment. The DNS
# zone is derived from global.environment rather than hardcoded, so there are no
# per-environment copies of this file to keep in sync. Only preview has its own
# template (values.preview.template.yaml), because it needs the -dev SSO app
# registration and the ASO blob storage.
global:
  environment: ${ENVIRONMENT:-aat}
  # The pipeline deploys each environment to exactly one CNP cluster (job.helm-deploy.yml), so
  # that cluster is always the active one. Read by CronJobs that keep the active-cluster check on.
  activeCronCluster: true

# Enable/disable subcharts
postgres:
  enabled: true
web:
  enabled: true
api:
  enabled: true
crons:
  enabled: true
# Off until legacy-account-database-url, legacy-publication-database-url and
# legacy-storage-account-name exist in the cath vault: the CSI mount fails the pod if a
# listed secret is missing. Never enable on aat, where an applied run
# would wipe E2E users and subscriptions (docs/migration/legacy-data-migration.md §11).
legacySync:
  enabled: false

# Web application configuration
#
# Hostnames MUST stay release-scoped (${TEAM_NAME}-{{ .Release.Name }}-...).
#
# Each environment is deployed twice, by design and as it was on SDS:
#   - Flux (cnp-flux-config/apps/cath) owns the plain names cath-web / cath-api /
#     cath-postgres, and the cath.{env}.platform.hmcts.net Front Door route
#   - this pipeline deploys release cath-service-{env} alongside it
#
# The release scoping is what keeps the two apart. Hardcoding the plain names here
# makes both ingresses claim the same hosts, and traefik then load balances across
# a healthy pod and a broken one, which surfaces as an intermittent 502. The
# resulting names look redundant (cath-cath-service-aat-web) because team and
# release are both cath-prefixed, but that is cosmetic - do not "tidy" it.
#
# The public URL is served by Flux's cath-web release, not by this one.
cath-web:
  nodejs:
    image: "hmctsprod.azurecr.io/cath/cath-web:${WEB_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-web.{{ .Values.global.environment }}.platform.hmcts.net"
    # Clears the subchart default (apps/web/helm/values.yaml), which claims the
    # Front Door host cath.{env}.platform.hmcts.net. Inheriting it gives both
    # releases an ingress rule for that host, and traefik may route Front Door
    # traffic here, where BASE_URL builds a redirect URI the SSO app does not
    # register (AADSTS50011).
    additionalIngressHosts: []
    environment:
      BASE_URL: "https://${TEAM_NAME}-{{ .Release.Name }}-web.{{ .Values.global.environment }}.platform.hmcts.net"
      # false on demo (production-like), true elsewhere. Resolved by
      # job.helm-deploy.yml; the :-true default keeps aat behaviour if unset.
      ENABLE_TEST_SUPPORT: "${ENABLE_TEST_SUPPORT:-true}"
      MANAGED_IDENTITY_CLIENT_ID: "${MANAGED_IDENTITY_CLIENT_ID}"
      # "false" on any environment holding migrated legacy subscriptions (§10 of the migration doc).
      OUTBOUND_ENABLED: "${OUTBOUND_ENABLED:-true}"

# API application configuration
cath-api:
  nodejs:
    image: "hmctsprod.azurecr.io/cath/cath-api:${API_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-api.{{ .Values.global.environment }}.platform.hmcts.net"
    environment:
      ENABLE_TEST_SUPPORT: "${ENABLE_TEST_SUPPORT:-true}"
      MANAGED_IDENTITY_CLIENT_ID: "${MANAGED_IDENTITY_CLIENT_ID}"
      # "false" on any environment holding migrated legacy subscriptions (§10 of the migration doc).
      OUTBOUND_ENABLED: "${OUTBOUND_ENABLED:-true}"

# Crons application configuration
cath-crons:
  job:
    image: "hmctsprod.azurecr.io/cath/cath-crons:${CRONS_IMAGE}"
    schedule: "*/5 * * * *"
    suspend: false
    kind: CronJob

# Legacy CaTH sync (docs/migration/legacy-data-migration.md): accounts at 02:00, then
# publications at 03:00. Dry runs unless LEGACY_SYNC_APPLY is "true". keyVaults replaces the
# subchart list rather than merging, so the default secrets are repeated. The legacy OAuth
# vault (LEGACY_THIRD_PARTY_KEY_VAULT) is unset until confirmed, so that copy reports as skipped.
# The syncs keep the active-cluster check on (the crons chart turns it off by default): two
# clusters running the same sync would race two delete-and-reload transactions against one
# database. The CronJob is suspended unless global.activeCronCluster is true.
cath-crons-legacy-sync:
  job:
    disableActiveClusterCheck: false
    image: "hmctsprod.azurecr.io/cath/cath-crons:${CRONS_IMAGE}"
    releaseNameOverride: "{{ .Release.Name }}-legacy-sync"
    schedule: "0 2 * * *"
    suspend: false
    kind: CronJob
    environment:
      SCRIPT_NAME: "legacy-sync"
      LEGACY_SYNC_APPLY: "false"
      THIRD_PARTY_KEY_VAULT: "cath-tp-{{ .Values.global.environment }}"
      MANAGED_IDENTITY_CLIENT_ID: "${MANAGED_IDENTITY_CLIENT_ID}"
    keyVaults:
      cath:
        secrets:
          - name: app-insights-connection-string
            alias: APPLICATION_INSIGHTS_CONNECTION_STRING
          - name: postgres-url
            alias: DATABASE_URL
          - name: storageaccount-connection-string
            alias: AZURE_STORAGE_CONNECTION_STRING
          - name: legacy-account-database-url
            alias: LEGACY_ACCOUNT_DATABASE_URL
          - name: legacy-storage-account-name
            alias: LEGACY_STORAGE_ACCOUNT_NAME

cath-crons-legacy-sync-publications:
  job:
    disableActiveClusterCheck: false
    image: "hmctsprod.azurecr.io/cath/cath-crons:${CRONS_IMAGE}"
    releaseNameOverride: "{{ .Release.Name }}-legacy-sync-publications"
    schedule: "0 3 * * *"
    suspend: false
    kind: CronJob
    environment:
      SCRIPT_NAME: "legacy-sync-publications"
      LEGACY_SYNC_APPLY: "false"
      MANAGED_IDENTITY_CLIENT_ID: "${MANAGED_IDENTITY_CLIENT_ID}"
    keyVaults:
      cath:
        secrets:
          - name: app-insights-connection-string
            alias: APPLICATION_INSIGHTS_CONNECTION_STRING
          - name: postgres-url
            alias: DATABASE_URL
          - name: storageaccount-connection-string
            alias: AZURE_STORAGE_CONNECTION_STRING
          - name: legacy-publication-database-url
            alias: LEGACY_PUBLICATION_DATABASE_URL
          - name: legacy-storage-account-name
            alias: LEGACY_STORAGE_ACCOUNT_NAME

# Postgres Prisma Studio service configuration
cath-postgres:
  nodejs:
    image: "hmctsprod.azurecr.io/cath/cath-postgres:${POSTGRES_IMAGE}"
    ingressHost: "${TEAM_NAME}-{{ .Release.Name }}-postgres.{{ .Values.global.environment }}.platform.hmcts.net"

# Blob storage - DISABLED for stg/prod (managed by Terraform, accessed via Key Vault)
blobstorage:
  enabled: false

# Dev dependencies - DISABLED for stg/prod (managed by Terraform)
postgresql:
  enabled: false

redis:
  enabled: false
