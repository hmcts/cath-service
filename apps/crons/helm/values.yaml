global:
  jobKind: CronJob
  enableKeyVaults: true
  tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
job:
  releaseNameOverride: "{{ .Release.Name }}-crons"
  disableActiveClusterCheck: true
  image: hmctsprod.azurecr.io/cath/cath-crons:latest
  aadIdentityName: cath
  environment:
    NODE_ENV: 'production'
    SCRIPT_NAME: 'example'
    POSTGRES_DATABASE: cath
    ENV_NAME: "{{ .Values.global.environment }}"
    GOVUK_NOTIFY_TEMPLATE_ID_MEDIA_APPLICATION_REPORT: c59c90a3-1806-4649-b4b5-b6bce8f8f72c
  keyVaults:
    cath:
      secrets:
        - name: app-insights-connection-string
          alias: APPLICATION_INSIGHTS_CONNECTION_STRING
        - name: postgres-url
          alias: DATABASE_URL
        - name: govuk-notify-api-key
          alias: GOVUK_NOTIFY_API_KEY
        - name: pip-team-email
          alias: MEDIA_APPLICATION_REPORT_RECIPIENT_EMAIL
  schedule: "0 0/10 * * *" # this is just a placeholder, configure in your flux
  concurrencyPolicy: Forbid
