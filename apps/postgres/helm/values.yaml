nodejs:
  releaseNameOverride: "{{ .Release.Name }}-postgres"
  # Single replica only: this pod runs the migration + seed runner on startup and
  # hosts Prisma Studio. The base nodejs chart enables an HPA by default (min 1 /
  # max 3), which OVERRIDES replicas, so autoscaling must be disabled for the pin
  # to take effect — otherwise a crash loop spikes CPU and the HPA scales to 3.
  replicas: 1
  autoscaling:
    enabled: false
  applicationPort: 5555
  aadIdentityName: cath
  ingressHost: cath-postgres.{{ .Values.global.environment }}.platform.hmcts.net
  image: 'hmctsprod.azurecr.io/cath/cath-postgres:latest'
  environment:
    POSTGRES_DATABASE: cath
  keyVaults:
    cath:
      secrets:
        - name: postgres-url
          alias: DATABASE_URL
