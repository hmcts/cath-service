nodejs:
  releaseNameOverride: "{{ .Release.Name }}-api"
  applicationPort: 3001
  aadIdentityName: cath
  ingressHost: cath-api.{{ .Values.global.environment }}.platform.hmcts.net
  image: 'hmctsprod.azurecr.io/cath/cath-api:latest'
  environment:
    NODE_ENV: 'production'
    POSTGRES_DATABASE: cath
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION: d9095328-839f-455a-98d9-46b000b4400d
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION_PDF_ONLY: 67e78ce9-9f28-4209-983b-e705f77fb339
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION_PDF_EXCEL: 01936af9-ab2e-4001-a135-cd70284f7a82
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION_EXCEL: fb95d98f-30e6-4227-a89d-f9525be4b5df
  keyVaults:
    cath:
      secrets:
        - name: app-insights-connection-string
          alias: APPLICATION_INSIGHTS_CONNECTION_STRING
        - name: redis-url
          alias: REDIS_URL
        - name: postgres-url
          alias: DATABASE_URL
        - name: app-tenant-id
          alias: AZURE_TENANT_ID
        - name: cath-service-api-client-id
          alias: CATH_SERVICE_API_CLIENT_ID
        - name: cath-service-api-client-scope
          alias: CATH_SERVICE_API_CLIENT_SCOPE
        - name: xhibit-s3-access-key
          alias: AWS_ACCESS_KEY_ID
        - name: xhibit-s3-access-key-secret
          alias: AWS_SECRET_ACCESS_KEY
        - name: govuk-notify-api-key
          alias: GOVUK_NOTIFY_API_KEY
        # Azure Blob Storage
        - name: storageaccount-connection-string
          alias: AZURE_STORAGE_CONNECTION_STRING
        - name: storageaccount-name
          alias: AZURE_STORAGE_ACCOUNT_NAME
