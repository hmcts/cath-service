# Local Development Helm Values
# This file is used when LOCAL_DEV=true is set in .env (local development only)
# It references the cath-aat Key Vault (VAULT_URI_SUFFIX=aat in .env): the vault
# URI is built as https://<keyVaults key>-<VAULT_URI_SUFFIX>.vault.azure.net/
# For pipeline deployments, see values.yaml
#
# Deliberately omitted compared with values.yaml, because local infrastructure
# (docker-compose) provides these and the root .env points at it:
#   - postgres-url            -> local Postgres on localhost:5433
#   - redis-url               -> local Redis on localhost:6380
#   - storageaccount-*        -> Azurite on localhost:10000
#   - app-insights-connection-string (no telemetry from local runs)
# Pulling the storage secrets locally makes the API write blobs to the real AAT
# storage account while the web app still reads Azurite, which breaks E2E tests.

nodejs:
  applicationPort: 3001
  aadIdentityName: cath
  environment:
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION: d9095328-839f-455a-98d9-46b000b4400d
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION_PDF_ONLY: 67e78ce9-9f28-4209-983b-e705f77fb339
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION_PDF_EXCEL: 01936af9-ab2e-4001-a135-cd70284f7a82
    GOVUK_NOTIFY_TEMPLATE_ID_SUBSCRIPTION_EXCEL: fb95d98f-30e6-4227-a89d-f9525be4b5df
  keyVaults:
    cath:
      secrets:
        # Azure AD app registration for the CaTH API (cath-service-api-non-prod)
        - name: app-tenant-id
          alias: AZURE_TENANT_ID
        - name: cath-service-api-client-id
          alias: CATH_SERVICE_API_CLIENT_ID
        - name: cath-service-api-client-scope
          alias: CATH_SERVICE_API_CLIENT_SCOPE
        # Xhibit S3 ingestion
        - name: xhibit-s3-access-key
          alias: AWS_ACCESS_KEY_ID
        - name: xhibit-s3-access-key-secret
          alias: AWS_SECRET_ACCESS_KEY
        # GOV.UK Notify - test key so local runs never send real emails
        - name: gov-uk-notify-test-api-key
          alias: GOVUK_NOTIFY_API_KEY
