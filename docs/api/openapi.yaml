openapi: 3.0.3

info:
  title: CaTH API
  version: 1.0.1
  description: |
    Court and Tribunal Hearings (CaTH) JSON API.

    The primary consumer-facing operation is `POST /publication` (also served at
    `POST /v1/publication`), used by upstream source systems (SNL, Common Platform,
    CP_CATH, PDDA) to publish hearing lists into CaTH. It implements the CaTH Inbound
    Publication API contract: all metadata travels in `x-*` request headers and the body
    carries only the payload. All other operations are read-only.

    This document is maintained by hand. It is not generated from the router, so if you
    change a route or a request/response shape in `apps/api` or `libs/public-pages`,
    update this file in the same change.

    Not documented here, deliberately:
      - `/users` and `/users/{id}` — placeholder routes returning example data.
      - `/test-support/**` — test-only routes, enabled by `ENABLE_TEST_SUPPORT`.
  license:
    name: MIT

servers:
  - url: https://cath-{release}-api.staging.platform.hmcts.net
    description: Staging. One deployment per release; `release` is the Helm release name.
    variables:
      release:
        default: cath-service
        description: Helm release name, e.g. `cath-service` or `pr-1234`.
  - url: http://localhost:3001
    description: Local development (`yarn dev`).

tags:
  - name: Publication
    description: Hearing list ingestion.
  - name: Locations
    description: Court and tribunal reference data.
  - name: Downloads
    description: Retrieval of published artefacts.
  - name: Service
    description: Service metadata and health.

paths:
  /:
    get:
      tags: [Service]
      summary: Service information
      description: Static metadata describing the service and its health endpoints.
      operationId: getServiceInfo
      security: []
      responses:
        "200":
          description: Service information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome to HMCTS API
                  version:
                    type: string
                    example: 1.0.0
                  endpoints:
                    type: object
                    properties:
                      health:
                        type: string
                        example: /health
                      liveness:
                        type: string
                        example: /health/liveness
                      readiness:
                        type: string
                        example: /health/readiness

  /locations:
    get:
      tags: [Locations]
      summary: List or search court locations
      description: |
        Returns all non-deleted court locations, sorted by name in the requested language.

        When `q` is supplied the result is filtered by name instead, with locations whose
        name starts with the search term ordered ahead of locations that merely contain it.
        A blank or whitespace-only `q` returns an empty array.
      operationId: getLocations
      security: []
      parameters:
        - name: language
          in: query
          required: false
          description: Language used for both sorting and name matching.
          schema:
            type: string
            enum: [en, cy]
            default: en
        - name: q
          in: query
          required: false
          description: Case-insensitive name search term.
          schema:
            type: string
          example: Birmingham
      responses:
        "200":
          description: Matching locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "500":
          description: Failed to fetch locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Failed to fetch locations

  /publication:
    post:
      tags: [Publication]
      summary: Publish a hearing list
      description: |
        Root path form of the CaTH Inbound Publication API, matching the incumbent
        `pip-data-management` contract exactly. Identical behaviour to
        `POST /v1/publication` — see that operation for the full description.
      operationId: createPublicationAtRoot
      security:
        - azureAd: []
      parameters:
        - $ref: "#/components/parameters/Provenance"
        - $ref: "#/components/parameters/CourtId"
        - $ref: "#/components/parameters/ContentDate"
        - $ref: "#/components/parameters/ListType"
        - $ref: "#/components/parameters/PublicationLanguage"
        - $ref: "#/components/parameters/ArtefactTypeHeader"
        - $ref: "#/components/parameters/SensitivityHeader"
        - $ref: "#/components/parameters/DisplayFrom"
        - $ref: "#/components/parameters/DisplayTo"
        - $ref: "#/components/parameters/SourceArtefactIdHeader"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        $ref: "#/components/requestBodies/Publication"
      responses:
        "201":
          $ref: "#/components/responses/PublicationCreated"
        "400":
          $ref: "#/components/responses/PublicationBadRequest"
        "401":
          $ref: "#/components/responses/PublicationUnauthorised"
        "403":
          $ref: "#/components/responses/PublicationForbidden"
        "409":
          $ref: "#/components/responses/PublicationConflict"
        "500":
          $ref: "#/components/responses/PublicationServerError"

  /v1/publication:
    post:
      tags: [Publication]
      summary: Publish a hearing list
      description: |
        Ingests a hearing list into CaTH. All publication metadata travels in `x-*` request
        headers; the body carries only the payload. One path serves three modes, selected by
        `Content-Type` and then by `x-type`:

        | `Content-Type` | `x-type` | Behaviour |
        |---|---|---|
        | `application/json` | `LIST` | Body **is** the publication payload, validated against the JSON Schema registered for `x-list-type`. Stored in blob storage, artefact persisted. |
        | `multipart/form-data` | `LIST` | A single part named `file`. Stored in blob storage, artefact persisted with `isFlatFile: true`. |
        | `multipart/form-data` | `LCSU` | An `.htm`/`.html` file. Uploaded to the AWS S3 bucket. **No artefact is persisted**, so the `201` body carries a blank `artefactId` (with `isFlatFile: true`). `x-list-type` is not required. |
        | `application/json` | `LCSU` | Rejected with `400` — LCSU is file-only. |
        | either | anything else | Rejected with `400`. `x-type` is never defaulted. |

        `x-type` is matched case-sensitively. For every mode the full `x-*` header set is
        validated *before* any file or database work, so an LCSU request with a missing
        header is rejected before anything reaches S3.

        There is no `hearing_list` wrapper, and no metadata is ever read from multipart form
        fields — a `type` form field is ignored.

        `x-sensitivity` defaults to `PUBLIC`. `x-display-from` and `x-display-to` are
        optional and persist as `null` when omitted; when both are supplied `x-display-to`
        must not be earlier than `x-display-from`.

        A publication supersedes an existing one when `x-court-id`, `x-content-date`,
        `x-language`, `x-list-type` and `x-provenance` all match.

        When `x-court-id` cannot be resolved against reference data the request is still
        accepted with `201`; the artefact is retained but PDF generation and subscriber
        notifications are skipped.

        Maximum payload is 100 MB. LCSU uploads are capped separately by
        `PDDA_HTML_MAX_FILE_SIZE` (default 10 MB).
      operationId: createPublication
      security:
        - azureAd: []
      parameters:
        - $ref: "#/components/parameters/Provenance"
        - $ref: "#/components/parameters/CourtId"
        - $ref: "#/components/parameters/ContentDate"
        - $ref: "#/components/parameters/ListType"
        - $ref: "#/components/parameters/PublicationLanguage"
        - $ref: "#/components/parameters/ArtefactTypeHeader"
        - $ref: "#/components/parameters/SensitivityHeader"
        - $ref: "#/components/parameters/DisplayFrom"
        - $ref: "#/components/parameters/DisplayTo"
        - $ref: "#/components/parameters/SourceArtefactIdHeader"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        $ref: "#/components/requestBodies/Publication"
      responses:
        "201":
          $ref: "#/components/responses/PublicationCreated"
        "400":
          $ref: "#/components/responses/PublicationBadRequest"
        "401":
          $ref: "#/components/responses/PublicationUnauthorised"
        "403":
          $ref: "#/components/responses/PublicationForbidden"
        "409":
          $ref: "#/components/responses/PublicationConflict"
        "500":
          $ref: "#/components/responses/PublicationServerError"

  /api/flat-file/{artefactId}/download:
    get:
      tags: [Downloads]
      summary: Download a flat-file artefact
      description: |
        Streams the stored flat file for an artefact. Authorisation is evaluated against
        the caller's session user and the artefact's sensitivity and list type, so the
        same artefact may be downloadable by one user and forbidden to another.

        Responses are always `Cache-Control: private, max-age=0, no-cache, no-store,
        must-revalidate`. The filename is returned in `Content-Disposition`, and the media
        type reflects the stored file, so it varies per artefact.
      operationId: downloadFlatFile
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ArtefactId"
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: Inline disposition carrying the original filename.
              schema:
                type: string
                example: inline; filename="daily-cause-list.pdf"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: |
            `artefactId` is not a valid UUID, or the artefact is not a flat file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  value:
                    error: Invalid request
                notFlatFile:
                  value:
                    error: Not a flat file
        "403":
          description: The caller may not access this artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Access denied
        "404":
          description: No such artefact, or the artefact exists but its file is missing from storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                artefactMissing:
                  value:
                    error: Artefact not found
                fileMissing:
                  value:
                    error: File not found in storage
        "410":
          description: Outside the artefact's display window. An absent display date is unbounded at that end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: File has expired

  /pdf/{artefactId}/download:
    get:
      tags: [Downloads]
      summary: Download the generated PDF for an artefact
      description: |
        Streams the PDF rendered for a published artefact. Unlike the flat-file route this
        checks only the artefact's display window, not per-user access.
      operationId: downloadPdf
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ArtefactId"
      responses:
        "200":
          description: The PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="3fa85f64-5717-4562-b3fc-2c963f66afa6.pdf"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: "`artefactId` is not a valid UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
        "404":
          description: No such artefact, or no PDF has been generated for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                artefactMissing:
                  value:
                    error: Artefact not found
                pdfMissing:
                  value:
                    error: PDF not found
        "410":
          description: Outside the artefact's display window. An absent display date is unbounded at that end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: File has expired

  /health:
    get:
      tags: [Service]
      summary: Health check
      description: Provided by `@hmcts-cft/cloud-native-platform`. Used by Kubernetes and the smoke-test job.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/liveness:
    get:
      tags: [Service]
      summary: Liveness probe
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Service is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/readiness:
    get:
      tags: [Service]
      summary: Readiness probe
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    azureAd:
      type: oauth2
      description: |
        Microsoft Entra ID (Azure AD) client-credentials flow. Send the access token as
        `Authorization: Bearer <token>`.

        Tokens are verified as RS256 against the tenant JWKS, with the audience set to the
        API's application (client) ID. Authorisation is then decided by the `roles` claim,
        which must contain `api.publisher.user`. That is an Entra ID **app role**, not an
        OAuth scope, so it is granted through app-role assignment rather than requested at
        token time.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes: {}
    session:
      type: apiKey
      in: cookie
      name: connect.sid
      description: |
        Express session cookie established by the CaTH web sign-in flow (CFT IdAM, Crime
        IdAM, or B2C depending on user type). The download routes authorise against the
        session user rather than a bearer token.

  parameters:
    ArtefactId:
      name: artefactId
      in: path
      required: true
      description: Artefact identifier. Must be a UUID; anything else is rejected with 400.
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: |
        Caller-supplied correlation identifier. Not persisted and not echoed in the response
        body; used for server-side logging and passed to S3 object metadata for LCSU uploads.
      schema:
        type: string
      example: 8f14e45f-ceea-467a-9f39-1a9cd1b0c2a4
    Provenance:
      name: x-provenance
      in: header
      required: true
      description: Source system publishing the list.
      schema:
        type: string
        enum: [MANUAL_UPLOAD, SNL, COMMON_PLATFORM, CP_CATH, PDDA]
      example: SNL
    CourtId:
      name: x-court-id
      in: header
      required: true
      description: |
        Court identifier. For the external provenances (`SNL`, `COMMON_PLATFORM`, `CP_CATH`,
        `PDDA`) this is the provenance's own location ID and is resolved against CaTH
        reference data. For `MANUAL_UPLOAD` it must be a numeric CaTH location ID.

        If the court cannot be resolved the request still succeeds with `201`; the artefact
        is stored but PDF generation and subscriber notifications are skipped.

        `x-location-id` is accepted as a fallback when `x-court-id` is absent. When both are
        sent, `x-court-id` wins.
      schema:
        type: string
      example: "1"
    ContentDate:
      name: x-content-date
      in: header
      required: true
      description: |
        Date the list content relates to, as an ISO 8601 date or date-time. Any time
        component is truncated on persist.
      schema:
        type: string
      example: "2026-09-14T14:00:00.001Z"
    ListType:
      name: x-list-type
      in: header
      required: false
      description: |
        List type name. Valid values are held in reference data rather than fixed in code,
        and the JSON Schema used to validate a JSON payload is selected from it. An
        unrecognised value returns `400` with the permitted values in the message.

        **Required for `x-type: LIST`; optional for `x-type: LCSU`.** The spec marks this
        header required but notes "Only set when x-type is set to 'LIST'", and the incumbent's
        own functional test uploads an LCSU file without it. When omitted the `Artefact`
        response reports `listType: null`.
      schema:
        type: string
      example: CIVIL_AND_FAMILY_DAILY_CAUSE_LIST
    PublicationLanguage:
      name: x-language
      in: header
      required: true
      description: |
        Publication language. Note the asymmetry with the response: `BILINGUAL` is accepted
        inbound but reported as `BI_LINGUAL` on the `Artefact` body.
      schema:
        type: string
        enum: [ENGLISH, WELSH, BILINGUAL]
      example: ENGLISH
    ArtefactTypeHeader:
      name: x-type
      in: header
      required: true
      description: |
        Routing discriminator. `LIST` publishes to blob storage and persists an artefact;
        `LCSU` uploads the file to the AWS S3 bucket and persists nothing. Matched
        case-sensitively; an unrecognised value is rejected rather than defaulted.
      schema:
        type: string
        enum: [LIST, LCSU]
      example: LIST
    SensitivityHeader:
      name: x-sensitivity
      in: header
      required: false
      description: Defaults to `PUBLIC` when omitted.
      schema:
        type: string
        enum: [PUBLIC, PRIVATE, CLASSIFIED]
        default: PUBLIC
    DisplayFrom:
      name: x-display-from
      in: header
      required: false
      description: |
        Start of the window during which the artefact is publicly visible. Omit for an
        unbounded start; the stored value is then `null`.
      schema:
        type: string
        format: date-time
      example: "2026-09-14T00:00:00.000Z"
    DisplayTo:
      name: x-display-to
      in: header
      required: false
      description: |
        End of the visibility window. Omit for an unbounded end. When both display headers
        are supplied this must not be earlier than `x-display-from`.
      schema:
        type: string
        format: date-time
      example: "2026-09-20T00:00:00.000Z"
    SourceArtefactIdHeader:
      name: x-source-artefact-id
      in: header
      required: false
      description: Optional identifier from the source system, retained for traceability.
      schema:
        type: string
      example: SNL-2026-09-14-001

  requestBodies:
    Publication:
      required: true
      description: |
        For `application/json` the body **is** the publication payload — an object or an
        array, depending on the list type. For `multipart/form-data` exactly one part named
        `file`; no metadata form fields are read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicationPayload"
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/PublicationFileUpload"
          encoding:
            file:
              contentType: application/octet-stream

  responses:
    PublicationCreated:
      description: |
        Created, or superseded. Also returned when `x-court-id` could not be resolved — the
        artefact is stored but PDF generation and notifications are skipped.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Artefact"
          examples:
            jsonPublication:
              summary: JSON publication
              value:
                artefactId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                contentDate: "2026-09-14T00:00:00.000Z"
                displayFrom: null
                displayTo: null
                isFlatFile: false
                language: ENGLISH
                listType: CIVIL_AND_FAMILY_DAILY_CAUSE_LIST
                locationId: "1"
                payload: https://cathsa.blob.core.windows.net/artefact/3fa85f64-5717-4562-b3fc-2c963f66afa6
                provenance: SNL
                sensitivity: PUBLIC
                sourceArtefactId: null
                type: LIST
            flatFilePublication:
              summary: Flat-file publication
              value:
                artefactId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                contentDate: "2026-09-14T00:00:00.000Z"
                displayFrom: "2026-09-14T00:00:00.000Z"
                displayTo: "2026-09-20T00:00:00.000Z"
                isFlatFile: true
                language: ENGLISH
                listType: CIVIL_AND_FAMILY_DAILY_CAUSE_LIST
                locationId: "1"
                payload: https://cathsa.blob.core.windows.net/artefact/3fa85f64-5717-4562-b3fc-2c963f66afa6
                provenance: SNL
                sensitivity: PUBLIC
                sourceArtefactId: null
                type: LIST
            lcsuUpload:
              summary: LCSU HTML upload — nothing persisted, so artefactId is blank
              value:
                artefactId: ""
                contentDate: "2026-09-14T00:00:00.000Z"
                displayFrom: null
                displayTo: null
                isFlatFile: true
                language: ENGLISH
                listType: null
                locationId: "1"
                provenance: PDDA
                sensitivity: PUBLIC
                sourceArtefactId: null
                type: LCSU

    PublicationBadRequest:
      description: |
        Missing or invalid header, unrecognised `x-type`, `LCSU` sent as
        `application/json`, a missing or empty `file` part, non-HTML LCSU file, JSON schema
        failure, or an over-size payload.

        A header failure reports **one** header, matching the incumbent, which throws on the
        first one it finds rather than collecting them. JSON schema failures are the exception:
        those are joined into the single `message` with `, `.

        Schema failures are phrased as the incumbent phrases them — the failing instance location
        as a JSON Pointer, then the problem, e.g.
        `/document: required property 'publicationDate' not found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          examples:
            missingHeader:
              summary: Required header omitted or empty
              value:
                message: x-court-id is mandatory however an empty value is provided
                timestamp: "2026-09-24T11:56:27.611"
            unknownType:
              summary: Unrecognised x-type
              value:
                message: "Unable to parse x-type. Please check that the value is of the correct format for the field (See Swagger documentation for correct formats)"
                timestamp: "2026-09-24T11:56:27.611"
            lcsuOverJson:
              summary: LCSU sent as application/json
              value:
                message: LCSU publications must be sent as multipart/form-data
                timestamp: "2026-09-24T11:56:27.611"
            lcsuWrongFormat:
              summary: LCSU file is not .htm or .html
              value:
                message: File format is not supported for LCSU.
                timestamp: "2026-09-24T11:56:27.611"
            emptyFile:
              summary: Multipart request with a missing or zero-byte file part
              value:
                message: Empty file provided, please provide a valid file
                timestamp: "2026-09-24T11:56:27.611"
            schemaFailure:
              summary: Payload failed the list type schema
              value:
                message: "/document: required property 'publicationDate' not found"
                timestamp: "2026-09-24T11:56:27.611"

    PublicationUnauthorised:
      description: |
        Missing, malformed, unverifiable or expired bearer token.

        Every one of those reports the same message. Publishers reach CaTH through APIM, which
        phrases OAuth rejections this way, so a token problem reads the same whether it was
        rejected at the gateway or here. Which check failed is logged, not returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
          example:
            statusCode: 401
            message: Access denied due to invalid OAuth information

    PublicationForbidden:
      description: Token is valid but lacks the `api.publisher.user` app role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
          example:
            statusCode: 403
            message: "Insufficient permissions. Required role: api.publisher.user"

    PublicationConflict:
      description: |
        A concurrent create for the same publication hit a unique-constraint violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: A publication with these details is already being created
            timestamp: "2026-09-24T11:56:27.611"

    PublicationServerError:
      description: Ingestion failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Internal server error during ingestion
            timestamp: "2026-09-24T11:56:27.611"

  headers:
    NoStore:
      description: Always set on download responses.
      schema:
        type: string
        example: private, max-age=0, no-cache, no-store, must-revalidate

  schemas:
    PublicationPayload:
      description: |
        The publication payload itself. Its structure depends entirely on `x-list-type` and
        is validated against that list type's JSON Schema — see
        `libs/list-types/*/src/schemas/*.json` for the authoritative definitions. Some list
        types are objects, others arrays. Total request size must not exceed 100 MB.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items:
            type: object
            additionalProperties: true

    PublicationFileUpload:
      type: object
      description: |
        Multipart form carrying exactly one part named `file`. All metadata comes from the
        `x-*` headers; form fields are never read.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: |
            For `x-type: LIST` the list document (any format). For `x-type: LCSU` an `.htm`
            or `.html` file, no larger than `PDDA_HTML_MAX_FILE_SIZE` (default 10 MB).

            Must be present and non-empty for either type: a missing part and a zero-byte one
            are both rejected with `400` and the same message.

    Artefact:
      type: object
      description: |
        The created publication, in camelCase, mirroring the incumbent's `Artefact`
        (`ArtefactView.External`) field for field.

        Note the field is **`locationId`**, not `courtId`. The pinned swagger names it `courtId`,
        but the incumbent's Java model declares `locationId` with no `@JsonProperty` rename, so
        `locationId` is what is actually serialised — the swagger is stale here, in the same way
        it is for the `x-court-id` / `x-location-id` request header.

        `lastReceivedDate`, `supersededCount` and `payloadSize` are `ArtefactView.Internal` on
        the incumbent and so are deliberately absent from this response.

        There is no `search` field: case data is extracted and persisted for subscription
        matching, but is not surfaced to the publisher.

        For an LCSU upload nothing is persisted, so `artefactId` is the empty string and
        `payload` is absent (`isFlatFile` is still `true`).
      required:
        - artefactId
        - contentDate
        - displayFrom
        - displayTo
        - language
        - listType
        - locationId
        - provenance
        - sensitivity
        - sourceArtefactId
        - type
      properties:
        artefactId:
          type: string
          description: |
            Identifier assigned to the stored artefact. Empty string for `x-type: LCSU`,
            which is a pass-through to S3 and persists nothing.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        contentDate:
          type: string
          format: date-time
          example: "2026-09-14T00:00:00.000Z"
        displayFrom:
          type: string
          format: date-time
          nullable: true
          description: "`null` when `x-display-from` was omitted."
        displayTo:
          type: string
          format: date-time
          nullable: true
          description: "`null` when `x-display-to` was omitted."
        isFlatFile:
          type: boolean
          description: |
            `true` for a multipart `LIST` publication, `false` for a JSON publication, and
            `true` for `LCSU` — the incumbent builds the LCSU metadata with the flat-file flag
            set even though the file goes to S3 rather than blob storage.
        language:
          type: string
          enum: [ENGLISH, WELSH, BI_LINGUAL]
          description: |
            Note the spelling: an inbound `x-language` of `BILINGUAL` is reported here as
            `BI_LINGUAL`.
        listType:
          type: string
          nullable: true
          description: "`null` for an `LCSU` upload that omitted `x-list-type`."
          example: CIVIL_AND_FAMILY_DAILY_CAUSE_LIST
        locationId:
          type: string
          description: |
            The persisted location ID. Prefixed with `NoMatch` when the submitted `x-court-id`
            could not be resolved against reference data — the publication is still accepted,
            so this is how a publisher sees that the court was not recognised.
          example: "1"
        payload:
          type: string
          format: uri
          description: |
            Blob storage URL the payload was written to. Absent for `LCSU`, which goes to S3
            and is not addressable through this API.
        provenance:
          type: string
          example: SNL
        sensitivity:
          type: string
          enum: [PUBLIC, PRIVATE, CLASSIFIED]
        sourceArtefactId:
          type: string
          nullable: true
        type:
          type: string
          enum: [LIST, LCSU]

    Message:
      type: object
      description: Error body used for `400`, `409` and `500`.
      required: [message, timestamp]
      properties:
        message:
          type: string
          description: |
            Human-readable failure description. A missing or empty required header reports a
            single header, phrased exactly as the incumbent does — an absent header and an empty
            one are indistinguishable. JSON schema failures are joined with `, `.
          example: "x-court-id is mandatory however an empty value is provided"
        timestamp:
          type: string
          description: |
            Local date-time with **no** zone suffix, matching the incumbent, where this is a Java
            `LocalDateTime` from `LocalDateTime.now()`. Fractional digits are emitted in groups of
            three as the value needs them, so a JVM may report nanoseconds
            (`2026-09-24T11:56:27.611289331`) where this service reports milliseconds — a JS
            `Date` has no finer resolution. Deliberately not `format: date-time`, which would
            require an offset.
          example: "2026-09-24T11:56:27.611"

    AuthErrorResponse:
      type: object
      description: |
        Body returned by the OAuth middleware, mirroring the shape APIM returns for the same
        failures so a publisher cannot tell whether the request was rejected at the gateway or
        by the service. Deliberately not a `Message` — it carries `statusCode` instead of a
        `timestamp`, and the spec declares no schema for `401`/`403`.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          description: Repeats the HTTP status from the status line.
          enum: [401, 403]
          example: 401
        message:
          type: string

    Location:
      type: object
      required: [locationId, name, welshName, regions, subJurisdictions]
      properties:
        locationId:
          type: integer
          example: 123
        name:
          type: string
          example: Birmingham Civil and Family Justice Centre
        welshName:
          type: string
        regions:
          type: array
          items:
            type: integer
        subJurisdictions:
          type: array
          items:
            type: integer
        provenanceLocationType:
          type: string

    HealthResponse:
      type: object
      description: Shape is defined by `@hmcts-cft/cloud-native-platform`.
      properties:
        status:
          type: string
          example: UP
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
