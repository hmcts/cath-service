# CaTH watchdog configuration.
#
# Read by hmcts/cnp-githubactions-library/appinsights-health-check. The action runs
# these queries and applies these rules; it has no queries of its own.
#
# {{window}} and {{baseline}} are substituted by the action (15m and 7d by default).
#
# Error checks are zero-threshold: any error is worth a look, and the suppressions
# list at the bottom is how known-benign noise gets silenced. Rate and ratio checks
# keep real thresholds, because zero is not a meaningful floor for a percentile.
#
# Two things every query needs, and the reason they are repeated rather than shared:
# each query is standalone KQL, so there is nowhere to put a common prelude.
#
#   app     — which application a row came from, taken from cloud_RoleInstance.
#             cloud_RoleName reports "unknown_service:node" for every app, so it
#             cannot be used to tell them apart. Pod names can: they are
#             cath-<app>-<hash>, cath-service-aat-<app>-<hash> or
#             cath-service-pr-<n>-<app>-<hash>.
#
#   !has '-pr-' — excludes preview deployments. They report to the same instance and
#             currently produce more telemetry than the real deployment, so without
#             this the watchdog mostly alerts on other people's open pull requests.
#
# Thresholds calibrated 2026-09-04 against cath-appinsights-aat: roughly 1800
# non-health requests/day. Revisit when traffic changes materially.

app-insights:
  # cath-appinsights-aat in cath-aat (DCD-CNP-DEV). The GUID, not the resource name:
  #   az monitor app-insights component show -g <rg> --app <name> --query appId -o tsv
  app-id: 1d78d448-ad9c-4ea1-a052-08d685b4d6bc

defaults:
  severity: medium
  renotify-after: 6h

checks:
  # ---------------------------------------------------------------------------
  # Errors — zero threshold. One row is enough.
  # ---------------------------------------------------------------------------

  - id: exceptions
    severity: high
    description: Any unhandled or tracked exception.
    fingerprint-by: [problemId, app]
    rule: { rows: '> 0' }
    query: |
      exceptions
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | extend app = extract(@'-(web|api|crons|postgres)-', 1, cloud_RoleInstance)
      | summarize occurrences = count(), sample = any(outerMessage)
          by problemId, app, type

  - id: server-errors
    severity: high
    description: Any 5xx response, health probes excluded.
    fingerprint-by: [name, resultCode, app]
    rule: { rows: '> 0' }
    query: |
      requests
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | where toint(resultCode) >= 500
      | where name !startswith 'GET /health'
      | extend app = extract(@'-(web|api|crons|postgres)-', 1, cloud_RoleInstance)
      | summarize occurrences = count(), p95_ms = percentile(duration, 95)
          by name, resultCode, app

  # Grouped by the SDK's operation name rather than target: blob targets carry the
  # artefact GUID and object path, so fingerprinting on them turns one underlying
  # problem into a new finding per object and nothing ever dedupes. Observed doing
  # exactly that — 17 findings from a single blob issue.
  - id: dependency-failures
    severity: high
    description: Any failed outbound call.
    fingerprint-by: [type, operation, app]
    rule: { rows: '> 0' }
    query: |
      dependencies
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | where success == false
      | extend app = extract(@'-(web|api|crons|postgres)-', 1, cloud_RoleInstance)
      | extend operation = trim_end(@':\d+$', tostring(name))
      | summarize failures = count(),
                  sample = any(resultCode),
                  sample_target = any(target)
          by type, operation, app

  - id: error-traces
    severity: medium
    description: Any log line at Error or Critical.
    fingerprint-by: [messageShape, app]
    rule: { rows: '> 0' }
    query: |
      traces
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | where severityLevel >= 3
      | extend app = extract(@'-(web|api|crons|postgres)-', 1, cloud_RoleInstance)
      // First line only, digits masked: a stack trace makes the fingerprint
      // unreadable, and line numbers would make it churn on every deploy.
      | extend messageShape = replace_regex(tostring(split(message, '\n')[0]), @'\d+', 'N')
      | summarize occurrences = count(), sample = any(message)
          by messageShape, app

  # Depends on the standard web test added in VIBE-552.
  - id: availability-failures
    severity: high
    description: Any failed availability test run.
    fingerprint-by: [name, location]
    rule: { rows: '> 0' }
    query: |
      availabilityResults
      | where timestamp > ago({{window}})
      | where success == false
      | summarize failures = count() by name, location

  # CaTH's crons ingest publications and send subscriber notifications, so a silent
  # failure here has more user impact than a 500 on a page.
  - id: cron-failures
    severity: high
    description: Any cron run that ended in an exception.
    fingerprint-by: [problemId]
    rule: { rows: '> 0' }
    query: |
      exceptions
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | where cloud_RoleInstance has '-crons-'
      | summarize failures = count(), sample = any(outerMessage) by problemId

  # ---------------------------------------------------------------------------
  # Liveness — fires on an empty result.
  # ---------------------------------------------------------------------------

  # Catches a dead or unschedulable deployment. crons is deliberately absent: it is a
  # CronJob, so no pod exists between runs and its silence is not a fault. Its health
  # is covered by cron-failures instead.
  - id: app-silent
    severity: high
    description: An application that should be reporting telemetry and is not.
    fingerprint-by: [expected_app]
    rule: { rows: '> 0' }
    query: |
      let expected = dynamic(['web', 'api']);
      let seen = union isfuzzy=true requests, traces, customMetrics, exceptions, dependencies
        | where timestamp > ago(1h)
        | where cloud_RoleInstance !has '-pr-'
        | summarize by app = extract(@'-(web|api|crons|postgres)-', 1, cloud_RoleInstance);
      print expected_app = expected
      | mv-expand expected_app to typeof(string)
      | where expected_app !in ((seen | project app))

  # Up but serving nobody, measured over a day rather than the usual window.
  #
  # AAT gets very little real traffic: 544 non-health requests in 24h on web and none
  # at all on api, mostly static assets from someone loading a page. A 15-minute window
  # is empty most of the time, so this looks for a day with no traffic — which does mean
  # a genuine outage is not caught here until it has lasted hours. app-silent and the
  # availability test are the checks that notice quickly; this one is a backstop for
  # "reachable but serving nothing", and only has meaning once there is real traffic.
  #
  # No time-of-day condition, so there is nothing that can filter the result away and
  # accidentally fire the check — an empty result here means exactly what it says.
  - id: no-user-traffic
    severity: low
    description: No successful non-health requests in a day.
    rule: { rows: '== 0' }
    query: |
      requests
      | where timestamp > ago(24h)
      | where cloud_RoleInstance !has '-pr-'
      | where name !startswith 'GET /health'
      | where success == true
      | take 1

  # ---------------------------------------------------------------------------
  # Rates and regressions — real thresholds, since zero is not a floor here.
  # ---------------------------------------------------------------------------

  # Observed: 1% over 24h (18 of 1800). 20% is deliberately well clear of that; it is
  # meant to catch broken routing or auth, not ordinary 404s.
  #
  # Measured over a day rather than {{window}}, like no-user-traffic above: web serves
  # around 544 non-health requests in 24h, so a 15-minute denominator is too small for a
  # share and the old `total >= 20` floor could only be crossed by a burst. sample_4xx
  # names the routes, without which a firing cannot distinguish a broken route from
  # someone probing the hostname.
  - id: client-error-rate
    severity: medium
    description: 4xx responses as a share of non-health traffic over a day.
    fingerprint-by: [app]
    rule: { column: rate, value: '> 0.2' }
    query: |
      requests
      | where timestamp > ago(24h)
      | where cloud_RoleInstance !has '-pr-'
      | where name !startswith 'GET /health'
      | extend app = extract(@'-(web|api|crons|postgres)-', 1, cloud_RoleInstance)
      | extend is_client_error = toint(resultCode) between (400 .. 499)
      | summarize total = count(),
                  client_errors = countif(is_client_error),
                  sample_4xx = make_set_if(strcat(name, ' -> ', resultCode), is_client_error, 10)
          by app
      | where total >= 200
      | extend rate = todouble(client_errors) / total

  # Observed p95 by operation over 24h: GET /cft-login/return 1257ms,
  # POST /subscription-confirmation-preview 1213ms, POST /v1/publication 952ms,
  # everything else below 660ms. Ratio-based rather than absolute so it adapts as the
  # service changes.
  #
  # The ratio needs an absolute floor as well, because now_n >= 5 is not enough samples
  # for percentile(duration, 95) to be a percentile: at n = 5 KQL returns the slowest of
  # the five. Without a floor this compares one slow request against a real 7-day p95 and
  # fires on any cold start or GC pause. Observed doing exactly that — GET / at 397.7ms
  # against a 90.6ms baseline, ratio 4.4, where latency-p99-absolute reported the
  # identical 397.7ms as p99 over the same 5 rows, proving both were one observation.
  #
  # 1000ms sits above every observed baseline except the login and preview routes, so a
  # route now has to be both slow enough for a user to notice and twice its baseline.
  # Raising now_n would be the statistically clean fix instead, but AAT serves ~66
  # non-health requests per 15 minutes and no single route reaches 20, so that would
  # silence the check outright — see issue #1061.
  - id: latency-p95-regression
    severity: medium
    description: Operation p95 more than double its trailing baseline.
    fingerprint-by: [name]
    rule: { column: ratio, value: '> 2' }
    query: |
      let base = requests
        | where timestamp between (ago({{baseline}}) .. ago({{window}}))
        | where cloud_RoleInstance !has '-pr-'
        | where name !startswith 'GET /health'
        | summarize p95_base = percentile(duration, 95), base_n = count() by name
        | where base_n >= 20;
      requests
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | where name !startswith 'GET /health'
      | summarize p95_now = percentile(duration, 95), now_n = count() by name
      | where now_n >= 5
      | join kind=inner base on name
      | where p95_base > 0
      | extend ratio = p95_now / p95_base
      | where p95_now > 1000
      | project name, p95_now, p95_base, ratio, now_n

  # Absolute backstop for the case the ratio check cannot see: an operation that has
  # always been slow has a baseline that makes its ratio look fine.
  - id: latency-p99-absolute
    severity: medium
    description: Operation p99 above 5 seconds.
    fingerprint-by: [name]
    rule: { column: p99_ms, value: '> 5000' }
    query: |
      requests
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | where name !startswith 'GET /health'
      | summarize p99_ms = percentile(duration, 99), n = count() by name
      | where n >= 5

  # Same absolute floor as latency-p95-regression above, and for the same reason: at
  # now_n >= 5, percentile(duration, 95) is the slowest of five rows rather than a
  # percentile, so the ratio fires on a single slow call.
  #
  # pg-pool.connect is the worst case for a bare ratio, because its latency is bimodal
  # by construction. Handing back an idle connection is sub-millisecond; opening a new
  # one is a TCP plus TLS plus auth round trip to Postgres and costs hundreds of ms. The
  # 7-day baseline p95 is therefore dominated by cheap reuse, while any window holding a
  # cold connect — a deploy, a scale event, an idle pool aging out — has p95 equal to
  # that connect. Observed at 478.1ms against a 92.1ms baseline, ratio 5.2, with zero
  # dependency failures in the same window. The ratio there is reporting what share of
  # acquisitions were cold, not whether Postgres is healthy.
  #
  # now_n is projected so a future triage can see the sample count without re-running
  # the query; the requests check above already exposes it.
  - id: dependency-latency-regression
    severity: low
    description: Dependency p95 more than double its trailing baseline.
    fingerprint-by: [operation, type]
    rule: { column: ratio, value: '> 2' }
    query: |
      let base = dependencies
        | where timestamp between (ago({{baseline}}) .. ago({{window}}))
        | where cloud_RoleInstance !has '-pr-'
        | extend operation = trim_end(@':\d+$', tostring(name))
        | summarize p95_base = percentile(duration, 95), base_n = count() by operation, type
        | where base_n >= 20;
      dependencies
      | where timestamp > ago({{window}})
      | where cloud_RoleInstance !has '-pr-'
      | extend operation = trim_end(@':\d+$', tostring(name))
      | summarize p95_now = percentile(duration, 95), now_n = count() by operation, type
      | where now_n >= 5
      | join kind=inner base on operation, type
      | where p95_base > 0
      | extend ratio = p95_now / p95_base
      | where p95_now > 1000
      | project operation, type, p95_now, p95_base, ratio, now_n

  # Day-of-week and hour-of-day aware: comparing a Sunday night against a Tuesday
  # afternoon would false-positive constantly. The expected_for_window floor
  # suppresses the check entirely when the baseline is too thin to judge.
  #
  # Baseline is whole past days rather than ago({{baseline}}): a range starting and ending
  # mid-hour only matches clipped fragments at its two edges, and the later one is today —
  # the traffic the drop would be measured against. 28d because the same-day-of-week filter
  # leaves only one comparable day in 7. The floor is 20 rather than 4 because assets are
  # counted individually, so 4 requests per 15 minutes sits inside a single page load; this
  # keeps the check quiet until a slot sustains real traffic.
  - id: volume-drop
    severity: medium
    description: Non-health traffic well below the same slot on comparable days.
    rule: { column: drop_ratio, value: '> 0.6' }
    query: |
      let current = toscalar(
        requests
        | where timestamp > ago({{window}})
        | where cloud_RoleInstance !has '-pr-'
        | where name !startswith 'GET /health'
        | count);
      requests
      | where timestamp between (startofday(ago(28d)) .. startofday(now()))
      | where cloud_RoleInstance !has '-pr-'
      | where name !startswith 'GET /health'
      | where dayofweek(timestamp) == dayofweek(now())
        and hourofday(timestamp) == hourofday(now())
      | summarize per_day = count() by bin(timestamp, 1d)
      | summarize baseline_per_hour = avg(per_day), days = count()
      | extend expected_for_window = baseline_per_hour * (totimespan('{{window}}') / 1h)
      | where days >= 2 and expected_for_window >= 20.0
      | extend current = current
      | extend drop_ratio = 1.0 - (todouble(current) / expected_for_window)

  # Scraping, a runaway client, or a retry storm.
  #
  # The ratio alone is not trustworthy here, hence the absolute floor on current below.
  # The day-of-week condition leaves only clipped partial hours in the baseline — one of
  # them the current hour's own earlier minutes — and bin(timestamp, 1d) counts each as a
  # whole hour, so expected_for_window comes out low and the ratio high. 100 requests in
  # 15 minutes is 400/hour against an observed 18-75/hour: past anything browsing produces,
  # well inside what a scraper or retry storm reaches. Fixing the baseline arithmetic needs
  # a longer baseline than 7d to have two real comparable days — see issue #1046.
  - id: volume-spike
    severity: low
    description: Non-health traffic far above the same slot on comparable days.
    rule: { column: spike_ratio, value: '> 3' }
    query: |
      let current = toscalar(
        requests
        | where timestamp > ago({{window}})
        | where cloud_RoleInstance !has '-pr-'
        | where name !startswith 'GET /health'
        | count);
      requests
      | where timestamp between (ago({{baseline}}) .. ago({{window}}))
      | where cloud_RoleInstance !has '-pr-'
      | where name !startswith 'GET /health'
      | where dayofweek(timestamp) == dayofweek(now())
        and hourofday(timestamp) == hourofday(now())
      | summarize per_day = count() by bin(timestamp, 1d)
      | summarize baseline_per_hour = avg(per_day), days = count()
      | extend expected_for_window = baseline_per_hour * (totimespan('{{window}}') / 1h)
      | where days >= 2 and expected_for_window >= 4.0
      | extend current = current
      | where current >= 100
      | extend spike_ratio = todouble(current) / expected_for_window

# Known-benign fingerprints. Every entry needs a reason — the action rejects the
# config otherwise. Review periodically: anything that has not fired in 90 days is
# probably hiding something that no longer happens, or that has changed shape.
#
# Matching is exact string equality, and the exceptions problemId carries the throw
# site inside @azure/core-client, so a version bump moves the line number and quietly
# stops these matching. Recheck them after a Renovate bump of that package.
suppressions:
  - fingerprint: "exceptions:ContainerAlreadyExists at handleErrorResponse (/opt/app/node_modules/@azure/core-client/dist/commonjs/deserializationPolicy.js:146:19):api"
    reason: uploadBlob calls createIfNotExists() on every upload and Terraform pre-creates the containers, so the SDK swallows this 409 itself and no upload fails.
  - fingerprint: "exceptions:ContainerAlreadyExists at handleErrorResponse (/opt/app/node_modules/@azure/core-client/dist/commonjs/deserializationPolicy.js:146:19):web"
    reason: uploadBlob calls createIfNotExists() on every upload and Terraform pre-creates the containers, so the SDK swallows this 409 itself and no upload fails.
  - fingerprint: "exceptions:BlobNotFound at handleErrorResponse (/opt/app/node_modules/@azure/core-client/dist/commonjs/deserializationPolicy.js:146:19):web"
    reason: downloadBlob and getBlobProperties treat 404 as absent and return null, and getFileBuffer probes up to three blob names by design, so a miss is an expected step rather than a failure — real blob loss still shows up under dependency-failures.
  - fingerprint: "exceptions:BlobNotFound at handleErrorResponse (/opt/app/node_modules/@azure/core-client/dist/commonjs/deserializationPolicy.js:146:19):api"
    reason: Same as the web entry above — the api hits the same exists-check paths. Not in the triage that produced the other three, because it happened not to fire in that window.
