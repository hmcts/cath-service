# Auto-update PRs
#
# After every push to master, merge master into each open, ready-for-review PR
# that targets it, so PRs don't drift behind and fail only once they're merged.
# Same action and settings as other HMCTS repos (e.g. fact-admin-frontend).
#
# - Conflicting PRs are skipped. conflict-check.yml owns those: it comments and,
#   when armed, rebases them.
# - Drafts are skipped.
# - PRs labelled `dependencies` are skipped. Renovate applies that label
#   (.github/renovate.json "labels"). A merge commit from this workflow would make
#   Renovate treat its branch as edited and stop updating it, and Renovate rebases
#   its own branches anyway.
#
# Uses the GitHub App token, not GITHUB_TOKEN. A push made with GITHUB_TOKEN doesn't
# trigger other workflows, so Preview wouldn't re-run and the PR would keep showing
# the checks of its old head.

name: Auto-update PRs

on:
  push:
    branches:
      - master

# A newer master push makes this run redundant: the next run merges the newer
# master into every eligible PR. Each PR update is one merge API call, so a
# cancelled run leaves nothing half-done.
concurrency:
  group: autoupdate-prs
  cancel-in-progress: true

permissions: {}

jobs:
  autoupdate:
    name: Update PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_PRIVATE_KEY }}
          # contents to merge master into the head branch, pull-requests to list PRs.
          permission-contents: write
          permission-pull-requests: read

      - name: Auto-update PRs
        # Prebuilt v1 (v1.7.0) image, pinned by digest.
        uses: docker://chinthakagodawita/autoupdate-action:v1@sha256:53d7013ad4689b703d2715d4b17d4901bb0a385e495e0b481f37adbe9b3cc3fc
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_CONFLICT_ACTION: ignore
          PR_READY_STATE: ready_for_review
          EXCLUDED_LABELS: dependencies
