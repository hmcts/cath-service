name: Probe PROD Reachability

# Throwaway for #1099: can the self-hosted runners reach the PROD hosts? The
# cath host resolves to Front Door, whose WAF only allows the IDAM IP list, so
# each runner prints its public IP to compare against that list. Delete this
# file before the PR merges.

on:
  pull_request:
    paths:
      - .github/workflows/probe.prod-reachability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.runner-group }})
    strategy:
      fail-fast: false
      matrix:
        runner-group: [azure-prod, azure-nonprod]
    runs-on:
      group: ${{ matrix.runner-group }}

    steps:
      - name: Public egress IP
        run: |
          curl -s --max-time 10 https://api.ipify.org || echo "could not fetch the public IP"
          echo

      - name: Probe the PROD hosts
        run: |
          for url in \
            https://cath.platform.hmcts.net/ \
            https://cath.platform.hmcts.net/health \
            https://cath.platform.hmcts.net/test-support/health \
            https://cath-api.platform.hmcts.net/ \
            https://cath-api.platform.hmcts.net/health; do
            host=$(echo "${url}" | sed -E 's#^https?://##; s#/.*$##')
            echo "=== ${url}"
            getent hosts "${host}" || echo "no DNS answer for ${host}"
            curl -s -o /dev/null --max-time 20 \
              -w "status=%{http_code} ip=%{remote_ip} time=%{time_total}s\n" "${url}" \
              || echo "curl failed"
          done

      # cath-api is only in the private platform.hmcts.net zone, which the runners
      # did not resolve. Check whether the backend gateway behind it is reachable
      # anyway: by its internal name, and by IP with the public host's SNI.
      - name: Probe the PROD API through the backend gateway
        run: |
          getent hosts cath-api-prod.service.core-compute-prod.internal \
            || echo "no DNS answer for cath-api-prod.service.core-compute-prod.internal"
          nc -zv -w 5 10.90.96.21 443 || echo "no TCP connection to 10.90.96.21:443"
          for path in / /health; do
            echo "=== cath-api.platform.hmcts.net${path} via 10.90.96.21"
            curl -s -o /dev/null --max-time 20 \
              --resolve cath-api.platform.hmcts.net:443:10.90.96.21 \
              -w "status=%{http_code} time=%{time_total}s\n" \
              "https://cath-api.platform.hmcts.net${path}" || echo "curl failed"
          done
