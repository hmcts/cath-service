name: Lint Job

on:
  workflow_call:

jobs:
  lint:
    name: Lint Changed Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # .nvmrc is the single source of the Node version. Renovate no longer edits
      # workflow files, so a hard-coded version here would silently drift.
      - name: Check workflows read Node version from .nvmrc
        run: |
          if grep -rnE '^\s*node-version:' .github/workflows; then
            echo "::error::Use node-version-file: '.nvmrc' instead of a hard-coded node-version"
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Cache Yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Validate Prisma schema
        run: yarn workspace @hmcts/postgres-prisma exec prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run lint for changed packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx turbo lint --filter="...[origin/${{ github.base_ref }}]"
          else
            npx turbo lint
          fi
