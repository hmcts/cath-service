name: Perftest

# Deploys the image master already built and promoted. There is deliberately no
# build, promote or e2e stage here: rebuilding would produce a different image
# for the same source.
#
# How it runs:
#   - workflow_call: workflow.main.yml calls this once promote-stage succeeds, so
#     github.sha is the master commit just built, deployed to aat, smoke-tested
#     and promoted.
#   - workflow_dispatch: redeploys the dispatched ref's HEAD (normally master).
#   - push to perftest: inert until the perftest branch exists. Moving the deploy onto a
#     dedicated branch is #1084.
#
# Infrastructure is applied from master (stage.infrastructure.yml runs Terraform
# for every non-prod environment), so it is not repeated here either.
on:
  push:
    branches:
      - perftest
  workflow_dispatch:
  workflow_call:

# Serialises a master-triggered deploy against a manual dispatch of the same
# release. It must differ from the caller's `main` group: a called workflow
# sharing its caller's group deadlocks.
concurrency:
  group: perftest
  cancel-in-progress: false

jobs:
  resolve-images:
    name: Resolve Promoted Images
    uses: ./.github/workflows/job.resolve-promoted-images.yml
    secrets: inherit

  deploy-stage:
    name: Deploy to Perftest
    needs: [resolve-images]
    uses: ./.github/workflows/stage.deploy.yml
    with:
      # change-id gives the release name cath-service-perftest. It must NOT drive
      # the image tag: no `perftest` tag was ever pushed. That is what image-tag
      # is for.
      change-id: perftest
      timestamp: ${{ needs.resolve-images.outputs.timestamp }}
      short-sha: ${{ needs.resolve-images.outputs.short-sha }}
      # Nothing was built in this run, so no app counts as affected.
      affected-apps: '[]'
      helm-apps: ${{ needs.resolve-images.outputs.helm-apps }}
      image-tag: ${{ needs.resolve-images.outputs.image-tag }}
      environment: perftest
    secrets: inherit

  smoke-test-stage:
    name: Smoke Test
    needs: [deploy-stage]
    if: always() && needs.deploy-stage.result == 'success'
    uses: ./.github/workflows/stage.smoke-test.yml
    with:
      change-id: perftest
      urls: ${{ needs.deploy-stage.outputs.urls }}
      runner-group: azure-prod
