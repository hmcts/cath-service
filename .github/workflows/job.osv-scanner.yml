name: OSV Scanner Job

on:
  workflow_call:

permissions:
  # Required to upload SARIF file to CodeQL
  actions: read
  # Required to upload SARIF file to security tab
  security-events: write
  # Only need to read contents
  contents: read

jobs:
  scan:
    name: Dependency Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      # osv-scanner has no severity threshold flag: it fails on any
      # vulnerability not ignored in osv-scanner.toml. Before v2.7.1 the
      # reusable workflow hid the scanner's rejection of --fail-on-severity
      # and reported "No issues found" without scanning.
      scan-args: |-
        --config=.github/osv-scanner.toml
        ./
      # Report-only until the backlog found by the first real scan is cleared
      # (#1626); findings still go to Security > Code scanning. Set back to
      # true then.
      fail-on-vuln: false
