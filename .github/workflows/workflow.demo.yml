name: Demo

# Deploys the image master already built and promoted. There is deliberately no
# build, promote or e2e stage here: rebuilding would produce a different image
# for the same source.
#
# How it runs:
#   - workflow_run: starts when a Main run on master completes, so it is a
#     separate run that cannot turn the master build red or hold it open.
#     job.check-promoted.yml skips the deploy unless that run promoted, and
#     deploys the commit it built rather than the current master HEAD.
#   - workflow_dispatch: redeploys the dispatched ref's HEAD (normally master).
#   - push to demo: inert until the demo branch exists. Moving the deploy onto
#     a dedicated branch is #1084.
#
# workflow_run only ever runs the default-branch copy of this file, so edits to
# the trigger do nothing until merged.
#
# Infrastructure is applied from master (stage.infrastructure.yml runs Terraform
# for every non-prod environment), so it is not repeated here either.
on:
  push:
    branches:
      - demo
  workflow_dispatch:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [master]

# Serialises a master-triggered deploy against a manual dispatch of the same
# release.
concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  check-promoted:
    name: Check Promoted
    permissions:
      actions: read
    uses: ./.github/workflows/job.check-promoted.yml

  resolve-images:
    name: Resolve Promoted Images
    needs: [check-promoted]
    if: needs.check-promoted.outputs.should-deploy == 'true'
    uses: ./.github/workflows/job.resolve-promoted-images.yml
    with:
      sha: ${{ needs.check-promoted.outputs.sha }}
    secrets: inherit

  deploy-stage:
    name: Deploy to Demo
    needs: [check-promoted, resolve-images]
    uses: ./.github/workflows/stage.deploy.yml
    with:
      # change-id gives the release name cath-service-demo. It must NOT drive the
      # image tag: no `demo` tag was ever pushed. That is what image-tag is for.
      change-id: demo
      timestamp: ${{ needs.resolve-images.outputs.timestamp }}
      short-sha: ${{ needs.resolve-images.outputs.short-sha }}
      # Nothing was built in this run, so no app counts as affected.
      affected-apps: '[]'
      helm-apps: ${{ needs.resolve-images.outputs.helm-apps }}
      image-tag: ${{ needs.resolve-images.outputs.image-tag }}
      environment: demo
      ref: ${{ needs.check-promoted.outputs.sha }}
    secrets: inherit

  smoke-test-stage:
    name: Smoke Test
    needs: [deploy-stage]
    if: always() && needs.deploy-stage.result == 'success'
    uses: ./.github/workflows/stage.smoke-test.yml
    with:
      change-id: demo
      urls: ${{ needs.deploy-stage.outputs.urls }}
      # demo.platform.hmcts.net is linked to the stg GitHub runner vnet
      # (hub-github-network-github-stg) but not the prod one, so azure-prod
      # runners fall through to public DNS and get NXDOMAIN for every release
      # host. See environments/demo/demo-platform-hmcts-net.yml in
      # hmcts/azure-private-dns.
      runner-group: azure-nonprod
