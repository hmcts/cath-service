name: Build and Publish Images Job

on:
  workflow_call:
    inputs:
      change-id:
        required: true
        type: string
        description: "PR number or change identifier"
    outputs:
      affected-apps:
        description: "JSON array of apps that were affected by changes"
        value: ${{ jobs.detect-affected.outputs.affected-apps }}
      helm-apps:
        description: "JSON array of all apps with Helm charts"
        value: ${{ jobs.detect-affected.outputs.helm-apps }}
      has-changes:
        description: "Whether any apps were affected by changes"
        value: ${{ jobs.detect-affected.outputs.has-changes }}
      timestamp:
        description: "Build timestamp"
        value: ${{ jobs.generate-metadata.outputs.timestamp }}
      short-sha:
        description: "Short git SHA"
        value: ${{ jobs.generate-metadata.outputs.short-sha }}

env:
  CHANGE_ID: ${{ inputs.change-id }}
  REGISTRY_NAME: hmctsprod

jobs:
  get-last-successful-sha:
    name: Get Last Successful Build SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.get-sha.outputs.sha }}
    steps:
      - name: Restore last successful SHA from cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .last-successful-sha
          key: last-successful-docker-build-sha-${{ inputs.change-id }}
          restore-keys: last-successful-docker-build-sha-${{ inputs.change-id }}

      - name: Read SHA
        id: get-sha
        run: |
          if [ -f .last-successful-sha ]; then
            SHA=$(cat .last-successful-sha)
            echo "Found last successful SHA: $SHA"
            echo "sha=$SHA" >> $GITHUB_OUTPUT
          else
            echo "No cached SHA found, will use origin/master"
            echo "sha=" >> $GITHUB_OUTPUT
          fi

  detect-affected:
    name: Detect Affected Apps
    runs-on: ubuntu-latest
    needs: get-last-successful-sha
    outputs:
      affected-apps: ${{ steps.detect.outputs.affected-apps }}
      helm-apps: ${{ steps.detect.outputs.helm-apps }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      needs-shared-build: ${{ steps.detect.outputs.needs-shared-build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Detect affected apps
        id: detect
        run: .github/workflows/jobs/build-and-publish-images/detect-affected-apps.sh "${{ needs.get-last-successful-sha.outputs.sha }}"

  generate-metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.metadata.outputs.timestamp }}
      short-sha: ${{ steps.metadata.outputs.short-sha }}
    steps:
      - name: Generate metadata
        id: metadata
        run: |
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "short-sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

  warm-shared-layers:
    name: Warm Shared Build Layers
    runs-on: ubuntu-latest
    needs: detect-affected
    if: needs.detect-affected.outputs.needs-shared-build == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shared stages into the layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: build
          # BuildKit cache keys are platform-specific, so this must match the
          # consuming builds below or every matrix leg misses the cache.
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=shared
          cache-to: type=gha,mode=max,scope=shared

  build-and-publish:
    name: Build & Publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    # warm-shared-layers is for ordering only - it produces a layer cache, not an
    # artefact, so `if` below deliberately ignores its result.
    needs: [detect-affected, warm-shared-layers]
    if: |
      !cancelled() &&
      needs.detect-affected.result == 'success' &&
      needs.detect-affected.outputs.has-changes == 'true'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-affected.outputs.affected-apps) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate build metadata
        id: metadata
        run: .github/workflows/jobs/build-and-publish-images/generate-build-metadata.sh "${{ env.CHANGE_ID }}" "${{ github.sha }}" "${{ matrix.app }}"

      - name: Determine image tags
        id: tags
        run: |
          # If change-id is numeric (PR number), use pr-{id} prefix
          # Otherwise use the change-id directly (e.g., staging)
          if [[ "${{ env.CHANGE_ID }}" =~ ^[0-9]+$ ]]; then
            echo "tag1=pr-${{ env.CHANGE_ID }}-${{ steps.metadata.outputs.short-sha }}" >> $GITHUB_OUTPUT
            echo "tag2=pr-${{ env.CHANGE_ID }}" >> $GITHUB_OUTPUT
          else
            echo "tag1=${{ env.CHANGE_ID }}-${{ steps.metadata.outputs.short-sha }}" >> $GITHUB_OUTPUT
            echo "tag2=${{ env.CHANGE_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: ACR login
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.REGISTRY_PREFIX }}
          tags: |
            ${{ steps.tags.outputs.tag1 }}
            ${{ steps.tags.outputs.tag2 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.app }}
            type=gha,scope=shared
          cache-to: type=gha,mode=min,scope=${{ matrix.app }}

  save-build-sha:
    name: Save Build SHA
    runs-on: ubuntu-latest
    needs: [build-and-publish, generate-metadata, detect-affected]
    if: |
      !cancelled() &&
      needs.detect-affected.result == 'success' &&
      (needs.build-and-publish.result == 'success' ||
       needs.detect-affected.outputs.has-changes == 'false')
    steps:
      - name: Save SHA to file
        run: echo "${{ github.sha }}" > .last-successful-sha

      - name: Cache the SHA
        uses: actions/cache/save@v5
        with:
          path: .last-successful-sha
          key: last-successful-docker-build-sha-${{ inputs.change-id }}
