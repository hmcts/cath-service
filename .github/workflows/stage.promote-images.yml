name: Promote Images Stage

on:
  workflow_call:
    inputs:
      change-id:
        required: true
        type: string
        description: "Change identifier used to build the source image tag (<change-id>-<short-sha>). Must match the value build-stage used."
      short-sha:
        required: true
        type: string
        description: "Short git SHA for source image tag"
      affected-apps:
        required: true
        type: string
        description: "JSON array of affected apps"
      helm-apps:
        required: true
        type: string
        description: "JSON array of all Helm apps"

jobs:
  promote-images:
    name: Promote
    uses: ./.github/workflows/job.promote-images.yml
    with:
      change-id: ${{ inputs.change-id }}
      short-sha: ${{ inputs.short-sha }}
      affected-apps: ${{ inputs.affected-apps }}
      helm-apps: ${{ inputs.helm-apps }}
    secrets: inherit

  helm-publish:
    name: Publish Chart
    uses: ./.github/workflows/job.helm-publish.yml
    with:
      short-sha: ${{ inputs.short-sha }}
    secrets: inherit

  save-successful-sha:
    name: Save Successful Build SHA
    needs: [promote-images, helm-publish]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Write SHA to file
        run: echo "${{ github.sha }}" > .last-successful-sha

      - name: Save SHA to cache
        uses: actions/cache/save@v5
        with:
          path: .last-successful-sha
          key: last-successful-docker-build-sha-${{ github.sha }}
