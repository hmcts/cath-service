name: One-Shot - Verify PROD Azure credentials

# Proves the PROD service principal secret (#1095) can log in and reach
# everything #1096 (Terraform) and #1099 (Helm deploy) will need, before either
# of them depends on it. Read-only: it creates, updates and deletes nothing in
# Azure.
#
# What each step proves:
#   - the secret is set, and azure/login accepts it
#   - the credential JSON's subscriptionId is DCD-CFTAPPS-PROD. aks-set-context
#     in cnp-githubactions-library/helm-deploy uses whatever subscription
#     azure/login leaves active, so any other value breaks the PROD deploy
#   - admin kubeconfig can be listed for cft-prod-00-aks and cft-prod-01-aks,
#     and their API servers answer from a GitHub-hosted runner
#   - the PROD private DNS zone used by "Register DNS" is readable
#   - the principal can read itself in Graph (terraform-deploy runs
#     `az ad sp show` for ci_service_principal_object_id)
#   - listKeys works on the PROD Terraform state store
#   - the role assignments granted under DTSPO-35946, for comparison with
#     docs/tickets/1095/plan.md Section 1
#   - network read on the DCD-CFTAPPS-PROD vnets
#
# Nothing sensitive is printed: storage keys are reduced to a count, kubeconfig
# is written to $RUNNER_TEMP and deleted, and the client ID is masked.
#
# Run once from master, then delete this file.

on:
  workflow_dispatch:
    inputs:
      dns-zone:
        description: "PROD private DNS zone written by Register DNS"
        type: string
        default: "prod.platform.hmcts.net"
      dns-resource-group:
        description: "Resource group of the PROD private DNS zone"
        type: string
        default: "core-infra-intsvc-rg"
      dns-subscription:
        description: "Subscription of the PROD private DNS zone"
        type: string
        default: "DTS-CFTPTL-INTSVC"
      check-dns:
        description: "Check the PROD private DNS zone (off until the PROD DNS ticket settles the zone)"
        type: boolean
        default: false

jobs:
  verify:
    name: Verify ${{ matrix.secret-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add AZURE_CREDENTIALS_CFT_PROD_TERRAFORM here only if PlatOps split
        # deploy and Terraform into two principals.
        secret-name: ["AZURE_CREDENTIALS_CFT_PROD"]
    env:
      AZURE_CREDENTIALS: ${{ secrets[matrix.secret-name] }}
      SECRET_NAME: ${{ matrix.secret-name }}
      AKS_SUBSCRIPTION: DCD-CFTAPPS-PROD
      CNP_SUBSCRIPTION: DCD-CNP-PROD
      STATE_STORE_ACCOUNT: mgmtstatestoreprod
      STATE_STORE_RESOURCE_GROUP: mgmt-state-store-prod
      DNS_ZONE: ${{ inputs.dns-zone }}
      DNS_RESOURCE_GROUP: ${{ inputs.dns-resource-group }}
      DNS_SUBSCRIPTION: ${{ inputs.dns-subscription }}
    steps:
      # An absent repository secret resolves to an empty string, and
      # azure/login then fails with a generic JSON parse error rather than
      # saying which secret is missing.
      - name: Check secret is set
        run: |
          set -euo pipefail
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "::error::${SECRET_NAME} is not set as a repository secret"
            exit 1
          fi
          echo "PASS: ${SECRET_NAME} is set"

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets[matrix.secret-name] }}

      - name: Check active subscription is DCD-CFTAPPS-PROD
        run: |
          set -euo pipefail
          # For a service principal login, user.name is the client ID. It is not
          # a secret, but masking it keeps it out of later output.
          CLIENT_ID=$(az account show --query user.name -o tsv)
          echo "::add-mask::${CLIENT_ID}"

          ACTIVE=$(az account show --query name -o tsv)
          echo "Active subscription: ${ACTIVE}"
          if [ "${ACTIVE}" != "${AKS_SUBSCRIPTION}" ]; then
            echo "::error::The credential JSON's subscriptionId resolves to '${ACTIVE}', not ${AKS_SUBSCRIPTION}. The PROD deploy will fail in aks-set-context."
            exit 1
          fi
          echo "PASS: active subscription is ${AKS_SUBSCRIPTION}"

      - name: AKS admin credentials and API probe (cft-prod-00-aks)
        env:
          CLUSTER_SUFFIX: "00"
        run: &aks-probe |
          set -euo pipefail
          CLUSTER="cft-prod-${CLUSTER_SUFFIX}-aks"
          RESOURCE_GROUP="cft-prod-${CLUSTER_SUFFIX}-rg"
          KUBECONFIG_FILE="${RUNNER_TEMP}/kube-${CLUSTER_SUFFIX}"

          # Cluster Admin Role is what listClusterAdminCredential needs. The
          # kubeconfig is written to a file and never printed.
          az aks get-credentials --admin \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${CLUSTER}" \
            --subscription "${AKS_SUBSCRIPTION}" \
            --file "${KUBECONFIG_FILE}" \
            --overwrite-existing \
            --only-show-errors
          echo "PASS: admin kubeconfig obtained for ${CLUSTER}"

          # get-credentials succeeding does not prove the API server is
          # reachable from a GitHub-hosted runner (authorized IP ranges or a
          # private cluster would block #1099), so make one read-only call.
          kubectl --kubeconfig "${KUBECONFIG_FILE}" --request-timeout=30s \
            get svc traefik -n admin -o name
          echo "PASS: ${CLUSTER} API server reachable"

      - name: AKS admin credentials and API probe (cft-prod-01-aks)
        env:
          CLUSTER_SUFFIX: "01"
        run: *aks-probe

      - name: Read PROD private DNS zone
        if: inputs.check-dns
        run: |
          set -euo pipefail
          # Read only. Private DNS Zone Contributor is proven by #1099's first
          # Register DNS, not here, so no records are written.
          az network private-dns zone show \
            --resource-group "${DNS_RESOURCE_GROUP}" \
            --name "${DNS_ZONE}" \
            --subscription "${DNS_SUBSCRIPTION}" \
            --query "{zone:name, recordSets:numberOfRecordSets}" -o table
          echo "PASS: ${DNS_ZONE} readable in ${DNS_RESOURCE_GROUP} (${DNS_SUBSCRIPTION})"

      - name: Graph self-read (az ad sp show)
        run: |
          set -euo pipefail
          CLIENT_ID=$(az account show --query user.name -o tsv)
          echo "::add-mask::${CLIENT_ID}"
          DISPLAY_NAME=$(az ad sp show --id "${CLIENT_ID}" --query displayName -o tsv)
          echo "Service principal: ${DISPLAY_NAME}"
          echo "PASS: principal can read itself in Graph"

      - name: Terraform state store listKeys (count only)
        run: |
          set -euo pipefail
          # Same order as state-store-init and the terraform-deploy library:
          # ARM checks access before existence, so listing keys from the wrong
          # subscription context fails with AuthorizationFailed.
          az account set --subscription "${CNP_SUBSCRIPTION}"

          # --query reduces the response to a count, so no key reaches the log
          # or a shell variable.
          COUNT=$(az storage account keys list \
            --account-name "${STATE_STORE_ACCOUNT}" \
            --resource-group "${STATE_STORE_RESOURCE_GROUP}" \
            --query "length(@)" -o tsv)
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::listKeys on ${STATE_STORE_ACCOUNT} returned no keys"
            exit 1
          fi
          echo "PASS: listKeys on ${STATE_STORE_ACCOUNT} returned ${COUNT} key(s)"

      # Informational: role names and scopes are not secret, and the output is
      # compared by hand against plan.md Section 1 (task 10). A principal with
      # only resource-scoped roles may not be able to list assignments in every
      # subscription, so a failure here is a warning, not a failed check.
      - name: List role assignments for the principal
        run: |
          set -euo pipefail
          CLIENT_ID=$(az account show --query user.name -o tsv)
          echo "::add-mask::${CLIENT_ID}"

          for SUBSCRIPTION in "${AKS_SUBSCRIPTION}" "${CNP_SUBSCRIPTION}" "${DNS_SUBSCRIPTION}"; do
            echo "Role assignments in ${SUBSCRIPTION}:"
            if ! az role assignment list \
              --assignee "${CLIENT_ID}" \
              --all \
              --subscription "${SUBSCRIPTION}" \
              --query "[].{role:roleDefinitionName, scope:scope}" -o table; then
              echo "::warning::Could not list role assignments in ${SUBSCRIPTION}"
            fi
          done

      - name: List DCD-CFTAPPS-PROD vnets (count only)
        run: |
          set -euo pipefail
          COUNT=$(az network vnet list \
            --subscription "${AKS_SUBSCRIPTION}" \
            --query "length(@)" -o tsv)
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::No vnets visible in ${AKS_SUBSCRIPTION}; network read is missing"
            exit 1
          fi
          echo "PASS: ${COUNT} vnet(s) visible in ${AKS_SUBSCRIPTION}"

      - name: Remove kubeconfig files
        if: always()
        run: rm -f "${RUNNER_TEMP}"/kube-*
