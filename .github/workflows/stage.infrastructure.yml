name: Infrastructure Stage

on:
  workflow_call:
    inputs:
      plan-only:
        required: false
        type: boolean
        default: false
        description: "Run plan only, skip apply"
      environments:
        required: false
        type: string
        default: '["aat"]'
        description: >-
          JSON array of environments to run Terraform for. Both callers pass the
          full list: master to plan and apply, pull requests to plan only, so
          every environment master will apply has been reviewed first. The aat
          default is only a fallback for a caller that omits this.

jobs:
  terraform-fmt:
    name: Terraform Format
    uses: ./.github/workflows/job.terraform-fmt.yml

  # cnp-githubactions-library resolves the state store names but never creates the
  # container, unlike the Jenkins library every other CNP service uses - see
  # stateStoreInit.groovy and resources/uk/gov/hmcts/contino/stateStoreInit.sh in
  # cnp-jenkins-library. Without this, adding an environment fails terraform init
  # with "404 The specified container does not exist" and needs someone to create
  # the container by hand. Remove this job if the library gains the equivalent.
  #
  # One job rather than a matrix leg per environment, so this is a single Azure
  # login rather than four, and a failure in one environment does not skip the
  # terraform legs for the others.
  state-store-init:
    name: State Store Init
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_CFT_PREVIEW }}

      - name: Create any missing terraform state containers
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          # Must match the storage-account input passed to job.terraform.yml
          # below; the library builds both names off this same postfix.
          STORAGE_ACCOUNT_POSTFIX: nonprod
        run: |
          set -euo pipefail

          ACCOUNT_NAME="mgmtstatestore${STORAGE_ACCOUNT_POSTFIX}"
          RESOURCE_GROUP="mgmt-state-store-${STORAGE_ACCOUNT_POSTFIX}"

          # Key-based auth, as the Jenkins script does. The service principal can
          # already list these keys - the library does it on every run - so this
          # needs no extra role. `az storage container create --auth-mode login`
          # would instead need Storage Blob Data Contributor on the account.
          KEY=$(az storage account keys list \
            --account-name "${ACCOUNT_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query '[0].value' -o tsv)
          echo "::add-mask::${KEY}"

          for ENVIRONMENT in $(echo "${ENVIRONMENTS}" | jq -r '.[]'); do
            CONTAINER="mgmtstatestorecontainer${ENVIRONMENT}"

            # create is idempotent without --fail-on-exist: it reports
            # "created": false when the container is already there.
            CREATED=$(az storage container create \
              --name "${CONTAINER}" \
              --account-name "${ACCOUNT_NAME}" \
              --account-key "${KEY}" \
              --public-access off \
              --query created -o tsv)

            echo "${CONTAINER}: created=${CREATED}"
          done

  terraform:
    name: Terraform ${{ matrix.environment }}
    needs: [terraform-fmt, state-store-init]
    # fail-fast: false so a broken perftest plan cannot cancel the aat apply.
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(inputs.environments) }}
    uses: ./.github/workflows/job.terraform.yml
    with:
      environment: ${{ matrix.environment }}
      # Per-environment values are inline fromJson lookups rather than a matrix
      # `include:`. An include entry that overrides an existing matrix key does
      # not annotate the combination, it ADDS one, so with include entries for
      # demo/ithc/perftest a caller passing '["aat"]' would silently plan all
      # four. Overriding one environment here is still a one-line change.
      subscription: ${{ fromJson('{"aat":"DCD-CNP-DEV","demo":"DCD-CNP-DEV","ithc":"DCD-CNP-DEV","perftest":"DCD-CNP-DEV"}')[matrix.environment] }}
      # The environment name does NOT match the CFTAPPS subscription name for two
      # of these: aat's network lives in DCD-CFTAPPS-STG and perftest's in
      # DCD-CFTAPPS-TEST. Only demo and ithc line up. DCD-CFTAPPS-PERFTEST does
      # not exist - az fails with "Subscription not found" - so this is a real
      # mapping, not a typo to be tidied up.
      aks-subscription: ${{ fromJson('{"aat":"DCD-CFTAPPS-STG","demo":"DCD-CFTAPPS-DEMO","ithc":"DCD-CFTAPPS-ITHC","perftest":"DCD-CFTAPPS-TEST"}')[matrix.environment] }}
      storage-account: nonprod
      plan-only: ${{ inputs.plan-only }}
      # One comment per PR, not one per environment. All four plans are still in
      # the Actions logs; four comments would bury the review discussion.
      post-plan-to-pr: ${{ matrix.environment == 'aat' }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS_CFT_PREVIEW }}
