name: Helm Deploy Job

on:
  workflow_call:
    inputs:
      change-id:
        required: true
        type: string
        description: "PR number or change identifier"
      timestamp:
        required: true
        type: string
        description: "Build timestamp for image tagging"
      short-sha:
        required: true
        type: string
        description: "Short git SHA for image tagging"
      affected-apps:
        required: true
        type: string
        description: "JSON array of affected apps"
      helm-apps:
        required: true
        type: string
        description: "JSON array of all Helm apps"
      environment:
        required: false
        type: string
        description: "Deployment environment (preview or aat)"
        default: "preview"
    outputs:
      urls:
        description: "Base64-encoded JSON of deployment URLs"
        value: ${{ jobs.helm-deploy.outputs.urls }}
      release-name:
        description: "Helm release name"
        value: ${{ jobs.helm-deploy.outputs.release-name }}
      namespace:
        description: "Kubernetes namespace"
        value: ${{ jobs.helm-deploy.outputs.namespace }}

env:
  CHANGE_ID: ${{ inputs.change-id }}
  REGISTRY: hmctsprod.azurecr.io

jobs:
  helm-deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Must exceed the stuck-release cleanup budget plus the 15m0s helm timeout
    # below, or the job is killed mid-install and leaves the release pending.
    timeout-minutes: 35
    outputs:
      urls: ${{ steps.urls.outputs.urls }}
      release-name: ${{ env.RELEASE_NAME }}
      namespace: ${{ env.TEAM_NAME }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          # Read metadata from root Helm chart
          CHART_PATH="helm/cath-service/Chart.yaml"
          TEAM_NAME=$(grep -A 1 'annotations:' "$CHART_PATH" | grep 'team:' | awk '{print $2}' | tr -d '"')
          APPLICATION_NAME=$(grep '^name:' "$CHART_PATH" | awk '{print $2}' | tr -d '"')

          echo "TEAM_NAME=${TEAM_NAME}" >> $GITHUB_ENV
          echo "APPLICATION_NAME=${APPLICATION_NAME}" >> $GITHUB_ENV
          echo "TIMESTAMP=${{ inputs.timestamp }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ inputs.short-sha }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV

          # Set dynamic image variables and release name
          .github/workflows/jobs/build-and-publish-images/set-image-variables.sh \
            '${{ inputs.affected-apps }}' \
            '${{ inputs.helm-apps }}' \
            '${{ env.CHANGE_ID }}' \
            '${{ inputs.short-sha }}' \
            '${{ inputs.timestamp }}' \
            "${APPLICATION_NAME}"

      - name: Azure login for ACR (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: ACR login
        run: az acr login --name "${REGISTRY%.azurecr.io}"

      # A cancelled or timed-out `helm upgrade --atomic` leaves the release in
      # pending-upgrade, and every later deploy then fails with "another
      # operation (install/upgrade/rollback) is in progress". Clear it first.
      # The cluster/RG names match how cnp-githubactions-library/helm-deploy
      # derives them: {environment}-aks and {environment}-rg.
      - name: Set up Helm (stuck-release cleanup)
        uses: azure/setup-helm@v5
        with:
          version: 'v4.2.3'

      - name: Azure login for AKS (stuck-release cleanup)
        uses: azure/login@v3
        with:
          creds: ${{ inputs.environment == 'aat' && secrets.AZURE_CREDENTIALS_CFT_AAT || secrets.AZURE_CREDENTIALS_CFT_PREVIEW }}

      - name: Get AKS credentials (stuck-release cleanup)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ inputs.environment == 'aat' && 'cft-aat-00' || 'cft-preview-00' }}-rg
          cluster-name: ${{ inputs.environment == 'aat' && 'cft-aat-00' || 'cft-preview-00' }}-aks
          admin: 'true'

      - name: Clear stuck Helm release
        continue-on-error: true
        timeout-minutes: 12
        run: |
          STATUS=$(helm status "${RELEASE_NAME}" -n "${TEAM_NAME}" -o json 2>/dev/null | jq -r '.info.status // empty' || true)
          case "$STATUS" in
            pending-install|pending-upgrade|pending-rollback)
              echo "Release ${RELEASE_NAME} is stuck in status: ${STATUS}."
              REVISIONS=$(helm history "${RELEASE_NAME}" -n "${TEAM_NAME}" -o json 2>/dev/null | jq 'length' || echo 0)
              if [ "${REVISIONS:-0}" -gt 1 ]; then
                echo "Rolling back to the last good revision instead of uninstalling."
                helm rollback "${RELEASE_NAME}" -n "${TEAM_NAME}" --cleanup-on-fail --wait --timeout 4m && exit 0
                echo "Rollback failed, falling back to uninstall."
              else
                echo "Only one revision - no good state to roll back to, uninstalling."
              fi
              # --wait is deliberately omitted: ASO resources (blob service,
              # flexible server database) sit in Terminating for minutes and
              # `helm uninstall --wait` blocks on them for no benefit, since the
              # release secret is already gone by then.
              helm uninstall "${RELEASE_NAME}" -n "${TEAM_NAME}" --timeout 4m || true
              ;;
            *)
              echo "Release status: ${STATUS:-not found}. No cleanup needed."
              ;;
          esac

      - name: Deploy to PREVIEW
        if: inputs.environment == 'preview'
        id: deploy-preview
        uses: hmcts/cnp-githubactions-library/helm-deploy@main
        with:
          environment: cft-preview-00
          team-name: ${{ env.TEAM_NAME }}
          application-name: ${{ env.APPLICATION_NAME }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS_CFT_PREVIEW }}
          release-name: ${{ env.RELEASE_NAME }}
          namespace: ${{ env.TEAM_NAME }}
          chart: helm/${{ env.APPLICATION_NAME }}
          values-template: helm/${{ env.APPLICATION_NAME }}/values.preview.template.yaml
          subchart-paths: apps/*/helm
          global-environment: aat
          business-area: Cross-Cutting
          timeout: 15m0s

      - name: Deploy to AAT
        if: inputs.environment == 'aat'
        id: deploy-aat
        uses: hmcts/cnp-githubactions-library/helm-deploy@main
        with:
          environment: cft-aat-00
          team-name: ${{ env.TEAM_NAME }}
          application-name: ${{ env.APPLICATION_NAME }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS_CFT_PREVIEW }}
          release-name: ${{ env.RELEASE_NAME }}
          namespace: ${{ env.TEAM_NAME }}
          chart: helm/${{ env.APPLICATION_NAME }}
          values-template: helm/${{ env.APPLICATION_NAME }}/values.template.yaml
          subchart-paths: apps/*/helm
          global-environment: aat
          business-area: Cross-Cutting
          timeout: 15m0s

      - name: Register DNS for AAT
        if: inputs.environment == 'aat'
        run: |
          # Get Traefik ingress IP
          INGRESS_IP=$(kubectl get svc traefik -n admin -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          # DNS config (matches Jenkins private-dns-config.yml)
          RESOURCE_GROUP="core-infra-intsvc-rg"
          ZONE="aat.platform.hmcts.net"
          SUBSCRIPTION="DTS-CFTPTL-INTSVC"
          TTL=300

          # Get all ingress hostnames for this release
          HOSTNAMES=$(kubectl get ingress -n ${{ env.TEAM_NAME }} \
            -l "app.kubernetes.io/instance=${{ env.RELEASE_NAME }}" \
            -o jsonpath='{.items[*].spec.rules[*].host}')

          for HOST in $HOSTNAMES; do
            # Extract record name (hostname without zone suffix)
            RECORD_NAME="${HOST%.${ZONE}}"

            echo "Registering DNS: ${RECORD_NAME} -> ${INGRESS_IP}"

            # Check if record exists
            if ! az network private-dns record-set a show \
              -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
              --subscription "$SUBSCRIPTION" &>/dev/null; then
              # Create new record
              az network private-dns record-set a create \
                -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
                --ttl "$TTL" --subscription "$SUBSCRIPTION"
              az network private-dns record-set a add-record \
                -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
                -a "$INGRESS_IP" --subscription "$SUBSCRIPTION"
            else
              # Update existing record
              az network private-dns record-set a update \
                -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
                --subscription "$SUBSCRIPTION" \
                --set "aRecords[0].ipv4Address=\"${INGRESS_IP}\"" --set "ttl=${TTL}"
            fi
          done

      - name: Get deployment URLs from ingress
        id: urls
        run: |
          # Get URLs and base64 encode to avoid special character issues in GitHub Actions
          URLS_JSON=$(.github/workflows/jobs/pr-comment/get-deployment-urls.sh "${{ env.TEAM_NAME }}" "${{ env.RELEASE_NAME }}")
          URLS_B64=$(echo -n "${URLS_JSON}" | base64 -w 0)
          echo "urls=${URLS_B64}" >> "$GITHUB_OUTPUT"
