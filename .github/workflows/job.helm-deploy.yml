name: Helm Deploy Job

on:
  workflow_call:
    inputs:
      change-id:
        required: true
        type: string
        description: "PR number or change identifier"
      timestamp:
        required: true
        type: string
        description: "Build timestamp for image tagging"
      short-sha:
        required: true
        type: string
        description: "Short git SHA for image tagging"
      affected-apps:
        required: true
        type: string
        description: "JSON array of affected apps"
      helm-apps:
        required: true
        type: string
        description: "JSON array of all Helm apps"
      environment:
        required: false
        type: string
        description: "Deployment environment (preview, aat, demo, ithc or perftest)"
        default: "preview"
      image-tag:
        required: false
        type: string
        default: ""
        description: >-
          Deploy an already-built image tag instead of deriving one from
          change-id. Either a bare tag or a JSON object of app -> tag. Used by
          the demo/ithc/perftest workflows, which do not build.
      cluster-suffix:
        required: false
        type: string
        default: "00"
        description: >-
          CNP cluster ordinal. CNP provides 00 and 01 for demo, ithc and
          perftest; only ever target one, or two traefiks claim the same host.
    outputs:
      urls:
        description: "Base64-encoded JSON of deployment URLs"
        value: ${{ jobs.helm-deploy.outputs.urls }}
      release-name:
        description: "Helm release name"
        value: ${{ jobs.helm-deploy.outputs.release-name }}
      namespace:
        description: "Kubernetes namespace"
        value: ${{ jobs.helm-deploy.outputs.namespace }}

env:
  CHANGE_ID: ${{ inputs.change-id }}
  REGISTRY: hmctsprod.azurecr.io

jobs:
  helm-deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Must exceed the 15m0s helm timeout below plus the recovery-timeout that
    # helm-deploy allows itself, or the job is killed mid-install and leaves the
    # release pending, which is the state the recovery then has to clean up.
    timeout-minutes: 35
    outputs:
      urls: ${{ steps.urls.outputs.urls }}
      release-name: ${{ env.RELEASE_NAME }}
      namespace: ${{ env.TEAM_NAME }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Everything that varies per environment is derived here, once. Deliberately
      # not five if:-guarded deploy steps: byte-identical steps that differ by
      # three values drift, which is how preview ended up mounting the aat vault.
      - name: Resolve environment configuration
        env:
          AZURE_CREDENTIALS: ${{ secrets[format('AZURE_CREDENTIALS_CFT_{0}', inputs.environment)] }}
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          SECRET_NAME="AZURE_CREDENTIALS_CFT_$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')"

          # An absent repository secret resolves to an empty string, and
          # azure/login then fails with a generic JSON parse error rather than
          # saying which secret is missing.
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "::error::${SECRET_NAME} is not set as a repository secret"
            exit 1
          fi

          case "$ENVIRONMENT" in
            preview)
              # There is no cath-preview key vault, so preview mounts the aat one.
              GLOBAL_ENVIRONMENT="aat"
              VALUES_TEMPLATE="values.preview.template.yaml"
              ENABLE_TEST_SUPPORT="true"
              ;;
            demo)
              # demo is production-like: no test-support endpoints.
              GLOBAL_ENVIRONMENT="demo"
              VALUES_TEMPLATE="values.template.yaml"
              ENABLE_TEST_SUPPORT="false"
              ;;
            aat|ithc|perftest)
              GLOBAL_ENVIRONMENT="$ENVIRONMENT"
              VALUES_TEMPLATE="values.template.yaml"
              ENABLE_TEST_SUPPORT="true"
              ;;
            *)
              echo "::error::Unsupported environment '${ENVIRONMENT}'"
              exit 1
              ;;
          esac

          # CNP cluster and resource group names are a pure function of the
          # environment, so no lookup table is needed.
          CLUSTER="cft-${ENVIRONMENT}-${{ inputs.cluster-suffix }}"

          {
            echo "ENVIRONMENT=${ENVIRONMENT}"
            echo "CLUSTER=${CLUSTER}"
            echo "GLOBAL_ENVIRONMENT=${GLOBAL_ENVIRONMENT}"
            echo "VALUES_TEMPLATE=${VALUES_TEMPLATE}"
            echo "ENABLE_TEST_SUPPORT=${ENABLE_TEST_SUPPORT}"
            echo "DNS_ZONE=${ENVIRONMENT}.platform.hmcts.net"
          } >> "$GITHUB_ENV"

          echo "Environment:        ${ENVIRONMENT}"
          echo "Cluster:            ${CLUSTER}"
          echo "Global environment: ${GLOBAL_ENVIRONMENT}"
          echo "Values template:    ${VALUES_TEMPLATE}"
          echo "Test support:       ${ENABLE_TEST_SUPPORT}"

      - name: Set environment variables
        run: |
          # Read metadata from root Helm chart
          CHART_PATH="helm/cath-service/Chart.yaml"
          TEAM_NAME=$(grep -A 1 'annotations:' "$CHART_PATH" | grep 'team:' | awk '{print $2}' | tr -d '"')
          APPLICATION_NAME=$(grep '^name:' "$CHART_PATH" | awk '{print $2}' | tr -d '"')

          echo "TEAM_NAME=${TEAM_NAME}" >> $GITHUB_ENV
          echo "APPLICATION_NAME=${APPLICATION_NAME}" >> $GITHUB_ENV
          echo "TIMESTAMP=${{ inputs.timestamp }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ inputs.short-sha }}" >> $GITHUB_ENV

          # Set dynamic image variables and release name. change-id still drives
          # the release name; image-tag, when supplied, drives the image tags
          # only - see set-image-variables.sh for why the two are decoupled.
          .github/workflows/jobs/build-and-publish-images/set-image-variables.sh \
            '${{ inputs.affected-apps }}' \
            '${{ inputs.helm-apps }}' \
            '${{ env.CHANGE_ID }}' \
            '${{ inputs.short-sha }}' \
            '${{ inputs.timestamp }}' \
            "${APPLICATION_NAME}" \
            '${{ inputs.image-tag }}'

      - name: Azure login for ACR (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: ACR login
        run: az acr login --name "${REGISTRY%.azurecr.io}"

      # helm-deploy clears a release left in pending-upgrade by an interrupted
      # deploy before it upgrades, which is why there is no cleanup step here.
      # recover-stuck-release defaults to true; set it to false to opt out.
      - name: Deploy
        id: deploy
        uses: hmcts/cnp-githubactions-library/helm-deploy@main
        with:
          environment: ${{ env.CLUSTER }}
          team-name: ${{ env.TEAM_NAME }}
          application-name: ${{ env.APPLICATION_NAME }}
          azure-credentials: ${{ secrets[format('AZURE_CREDENTIALS_CFT_{0}', inputs.environment)] }}
          release-name: ${{ env.RELEASE_NAME }}
          namespace: ${{ env.TEAM_NAME }}
          chart: helm/${{ env.APPLICATION_NAME }}
          values-template: helm/${{ env.APPLICATION_NAME }}/${{ env.VALUES_TEMPLATE }}
          subchart-paths: apps/*/helm
          global-environment: ${{ env.GLOBAL_ENVIRONMENT }}
          business-area: Cross-Cutting
          timeout: 15m0s

      # Preview hosts are registered by the preview platform, not here. Without
      # this step the release-scoped hosts have no A record and the smoke test
      # fails with HTTP 000, which reads like an app failure but is DNS.
      - name: Register DNS
        if: inputs.environment != 'preview'
        run: |
          # Get Traefik ingress IP
          INGRESS_IP=$(kubectl get svc traefik -n admin -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          # DNS config (matches Jenkins private-dns-config.yml). The resource
          # group and subscription hold every CNP non-prod private zone; only the
          # zone itself is per-environment.
          RESOURCE_GROUP="core-infra-intsvc-rg"
          ZONE="${DNS_ZONE}"
          SUBSCRIPTION="DTS-CFTPTL-INTSVC"
          TTL=300

          # Get all ingress hostnames for this release
          HOSTNAMES=$(kubectl get ingress -n ${{ env.TEAM_NAME }} \
            -l "app.kubernetes.io/instance=${{ env.RELEASE_NAME }}" \
            -o jsonpath='{.items[*].spec.rules[*].host}')

          for HOST in $HOSTNAMES; do
            # Extract record name (hostname without zone suffix)
            RECORD_NAME="${HOST%.${ZONE}}"

            # Some ingress hosts are Front Door entry points that already exist as
            # CNAMEs in this zone (see additionalIngressHosts in the values
            # template). DNS forbids an A and a CNAME at the same name, so creating
            # one fails the whole step with:
            #   (Conflict) The record could not be created because a CNAME record
            #   with the same name already exists in this zone.
            if az network private-dns record-set cname show \
              -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
              --subscription "$SUBSCRIPTION" &>/dev/null; then
              echo "Skipping ${RECORD_NAME}: already a CNAME (Front Door entry point)"
              continue
            fi

            echo "Registering DNS: ${RECORD_NAME} -> ${INGRESS_IP}"

            # Check if record exists
            if ! az network private-dns record-set a show \
              -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
              --subscription "$SUBSCRIPTION" &>/dev/null; then
              # Create new record
              az network private-dns record-set a create \
                -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
                --ttl "$TTL" --subscription "$SUBSCRIPTION"
              az network private-dns record-set a add-record \
                -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
                -a "$INGRESS_IP" --subscription "$SUBSCRIPTION"
            else
              # Update existing record
              az network private-dns record-set a update \
                -g "$RESOURCE_GROUP" -z "$ZONE" -n "$RECORD_NAME" \
                --subscription "$SUBSCRIPTION" \
                --set "aRecords[0].ipv4Address=\"${INGRESS_IP}\"" --set "ttl=${TTL}"
            fi
          done

      - name: Get deployment URLs from ingress
        id: urls
        run: |
          # Get URLs and base64 encode to avoid special character issues in GitHub Actions
          URLS_JSON=$(.github/workflows/jobs/pr-comment/get-deployment-urls.sh "${{ env.TEAM_NAME }}" "${{ env.RELEASE_NAME }}")
          URLS_B64=$(echo -n "${URLS_JSON}" | base64 -w 0)
          echo "urls=${URLS_B64}" >> "$GITHUB_OUTPUT"
