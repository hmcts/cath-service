name: Smoke Test Job

on:
  workflow_call:
    inputs:
      urls:
        required: true
        type: string
        description: "Base64-encoded JSON of deployment URLs"
      runner-group:
        required: false
        type: string
        description: "GitHub Actions runner group"
        default: "azure-nonprod"
      run-publication-smoke:
        required: false
        type: boolean
        description: "Run the publication upload smoke spec (needs test-support enabled on the API)"
        default: false

# The publication smoke step needs repo secrets AZURE_CLIENT_ID and AZURE_TENANT_ID (CI OIDC identity),
# passed via secrets: inherit, plus Key Vault cath-bootstrap-aat secrets app-tenant,
# cath-service-api-client-id and cath-service-api-client-secret (API client with api.publisher.user).

jobs:
  smoke-test:
    name: Smoke Test
    runs-on:
      group: ${{ inputs.runner-group }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Decode deployment URLs
        id: urls
        run: |
          URLS_B64="${{ inputs.urls }}"
          URLS_JSON=$(echo -n "${URLS_B64}" | base64 -d)
          echo "Deployment URLs JSON: ${URLS_JSON}"
          echo "urls=${URLS_JSON}" >> "$GITHUB_OUTPUT"

      - name: Network diagnostics
        run: |
          URLS_JSON='${{ steps.urls.outputs.urls }}'
          for key in web api postgres; do
            URL=$(echo "${URLS_JSON}" | jq -r ".${key} // empty")
            if [ -z "${URL}" ]; then continue; fi
            HOST=$(echo "${URL}" | sed -E 's#^https?://##; s#/.*$##')
            echo "=== ${key}: ${HOST} ==="
            echo "--- dig ${HOST} ---"
            dig "${HOST}" || true
            echo "--- nc -zv -w 3 ${HOST} 443 ---"
            nc -zv -w 3 "${HOST}" 443 || true
          done

      - name: Health check - Web
        run: |
          URLS_JSON='${{ steps.urls.outputs.urls }}'
          WEB_URL=$(echo "${URLS_JSON}" | jq -r '.web // empty')

          if [ -n "${WEB_URL}" ]; then
            echo "Checking web health: ${WEB_URL}"
            MAX_RETRIES=10
            RETRY_DELAY=10

            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${WEB_URL}" || echo "000")
              echo "Attempt ${i}/${MAX_RETRIES}: HTTP Status ${HTTP_STATUS}"

              if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
                echo "Web service is healthy"
                exit 0
              fi

              if [ "$i" -lt "$MAX_RETRIES" ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done

            echo "Web service failed after ${MAX_RETRIES} attempts"
            exit 1
          else
            echo "No web URL found, skipping web health check"
          fi

      - name: Health check - API
        run: |
          URLS_JSON='${{ steps.urls.outputs.urls }}'
          API_URL=$(echo "${URLS_JSON}" | jq -r '.api // empty')

          if [ -n "${API_URL}" ]; then
            echo "Checking API health: ${API_URL}"
            MAX_RETRIES=10
            RETRY_DELAY=10

            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${API_URL}" || echo "000")
              echo "Attempt ${i}/${MAX_RETRIES}: HTTP Status ${HTTP_STATUS}"

              if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
                echo "API service is healthy"
                exit 0
              fi

              if [ "$i" -lt "$MAX_RETRIES" ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done

            echo "API service failed after ${MAX_RETRIES} attempts"
            exit 1
          else
            echo "No API URL found, skipping API health check"
          fi

      - name: Checkout code
        if: inputs.run-publication-smoke
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: inputs.run-publication-smoke
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        if: inputs.run-publication-smoke
        run: corepack enable

      # Install before Azure login so dependency install scripts never see the az session or API credentials
      - name: Install dependencies
        if: inputs.run-publication-smoke
        run: yarn install --immutable

      - name: Azure login (OIDC)
        if: inputs.run-publication-smoke
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Credentials are fetched into this step's shell only, not $GITHUB_ENV, so no other step can read them
      - name: Publication upload smoke test
        id: publication-smoke
        if: inputs.run-publication-smoke
        run: |
          set -euo pipefail

          URLS_JSON='${{ steps.urls.outputs.urls }}'
          CATH_SERVICE_API_URL=$(echo "${URLS_JSON}" | jq -r '.api // empty')
          if [ -z "${CATH_SERVICE_API_URL}" ]; then
            echo "::error::No API URL found in deployment"
            exit 1
          fi

          KV="cath-bootstrap-aat"
          fetch() { az keyvault secret show --vault-name "$KV" --name "$1" --query value -o tsv; }

          CATH_SERVICE_API_CLIENT_SECRET=$(fetch cath-service-api-client-secret)
          echo "::add-mask::${CATH_SERVICE_API_CLIENT_SECRET}"
          AZURE_TENANT_ID=$(fetch app-tenant)
          CATH_SERVICE_API_CLIENT_ID=$(fetch cath-service-api-client-id)

          export CATH_SERVICE_API_URL AZURE_TENANT_ID CATH_SERVICE_API_CLIENT_ID CATH_SERVICE_API_CLIENT_SECRET
          yarn workspace e2e-tests run test:smoke

      - name: Upload smoke test results
        uses: actions/upload-artifact@v6
        if: always() && steps.publication-smoke.outcome == 'failure'
        with:
          name: smoke-test-results
          path: e2e-tests/test-results/
          retention-days: 7

      - name: Smoke test summary
        run: |
          echo "=========================================="
          echo "Smoke Test Summary"
          echo "=========================================="
          echo "All health checks passed successfully!"
          if [ "${{ inputs.run-publication-smoke }}" = "true" ]; then
            echo "Publication upload smoke test passed"
          fi
