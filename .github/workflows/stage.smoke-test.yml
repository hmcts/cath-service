name: Smoke Test Stage

on:
  workflow_call:
    inputs:
      change-id:
        required: true
        type: string
        description: "PR number or change identifier"
      urls:
        required: true
        type: string
        description: "Base64-encoded JSON of deployment URLs"
      # Only for the PR comment: the smoke tests do not check the hosted parity check
      ui-baseline-url:
        required: false
        type: string
        default: ""
        description: "Where the hosted parity check is, when the deploy deployed it"
      is-pr:
        required: false
        type: boolean
        default: false
        description: "Whether this is a PR (enables PR comment)"
      runner-group:
        required: false
        type: string
        description: "GitHub Actions runner group"
        default: "azure-nonprod"
      run-publication-smoke:
        required: false
        type: boolean
        default: false
        description: "Run the publication upload smoke spec"

jobs:
  pr-comment:
    name: PR Comment
    if: inputs.is-pr
    uses: ./.github/workflows/job.pr-comment.yml
    with:
      change-id: ${{ inputs.change-id }}
      urls: ${{ inputs.urls }}
      ui-baseline-url: ${{ inputs.ui-baseline-url }}

  smoke-test:
    name: Smoke Test
    uses: ./.github/workflows/job.smoke-test.yml
    with:
      urls: ${{ inputs.urls }}
      runner-group: ${{ inputs.runner-group }}
      run-publication-smoke: ${{ inputs.run-publication-smoke }}
    secrets: inherit
