# Conflict Check
#
# After every push to master, each open PR gets its own job that predicts whether
# it would now conflict, comments if so, and hands it to Claude to rebase.
#
# Deliberately only on push to master: the interesting event is the base moving
# under PRs nobody is touching, and there is no GitHub event for "master just
# broke PR #123". A PR whose own push introduces a conflict is caught by the next
# push to master rather than immediately.
#
# One job per PR — check and rebase together. Checking is read-only (`git
# merge-tree` merges in the object database, so no branch is touched and no
# preview build is triggered) and a clean PR's job stops right there. Only a PR
# that actually conflicts pays for yarn install, Claude and a force-push.
#
# Checking and rebasing in the same job is what keeps the force-with-lease honest:
# the head SHA is read once, immediately before the rebase, so there is no window
# between "decided to rebase" and "rebased" for the author to push into.
#
# Comments are sticky — the marker identifies this workflow's comment so it is
# edited in place rather than re-posted, and it is removed once the PR merges
# cleanly again. A PR whose conflicted file set has not changed is left untouched
# so nobody is re-notified about a conflict they already know about.

name: Conflict Check

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report findings in the log without commenting or rebasing"
        type: boolean
        default: true
      auto-rebase:
        description: "Hand conflicting PRs to Claude to rebase and resolve"
        type: boolean
        default: true

jobs:
  list-prs:
    name: List Open PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: List open PRs
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Drafts are included deliberately — a stale draft is still worth flagging.
          # `sha` here is only a starting point; each job re-reads its PR's head
          # before rebasing, so a PR pushed while this run is queued is handled
          # against its current head rather than this snapshot.
          gh pr list --state open --base master --limit 200 \
            --json number,headRefName,headRefOid,isCrossRepository \
            --jq '[.[] | {number, head: .headRefName, sha: .headRefOid, fork: .isCrossRepository}]' \
            > /tmp/prs.json

          count=$(jq length /tmp/prs.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "prs=$(jq -c . /tmp/prs.json)" >> "$GITHUB_OUTPUT"
          echo "$count open PR(s) targeting master:"
          jq -r '.[] | "  #\(.number) \(.head)\(if .fork then " (fork)" else "" end)"' /tmp/prs.json

  check-and-rebase:
    name: PR #${{ matrix.pr.number }} ${{ matrix.pr.head }}
    needs: [list-prs]
    if: needs.list-prs.outputs.count != '0'
    strategy:
      # Checking is cheap, so legs can overlap. Each successful rebase force-pushes
      # and fires that PR's preview pipeline; those are already per-PR concurrent in
      # normal use, so overlapping here changes timing rather than total spend.
      max-parallel: 4
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.list-prs.outputs.prs) }}
    runs-on: ubuntu-latest
    concurrency:
      # Per-PR, and deliberately NOT cancel-in-progress: a second master push must
      # not kill a rebase that is midway through resolving. Runs for the same PR
      # queue instead.
      group: conflict-check-pr-${{ matrix.pr.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_PRIVATE_KEY }}
          # Defaults to every permission the App is installed with. This job needs
          # exactly two: contents to fetch and force-push the branch, pull-requests
          # to post the report. Claude runs unattended with this token in reach, so
          # keep it to the minimum.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Full history: merge-tree and rebase both need the merge base.
          fetch-depth: 0
          # Without this the token is written into .git/config as an http
          # extraheader, where Claude — running with Bash(git:*) — could read it.
          # The pushes below set it on the remote URL only when they need it.
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "claude-code-bot[bot]"
          git config user.email "claude-code-bot[bot]@users.noreply.github.com"

      - name: Check for conflicts
        id: check
        env:
          NUMBER: ${{ matrix.pr.number }}
          HEAD_REF: ${{ matrix.pr.head }}
        run: |
          git fetch --quiet origin master

          # Read the PR head fresh rather than trusting the enumerated SHA. For a
          # same-repo PR fetch the branch; refs/pull/<n>/head also covers forks but
          # can lag behind the branch by a few seconds after a push.
          if git fetch --quiet origin "+refs/heads/${HEAD_REF}:refs/remotes/pr-head" 2>/dev/null; then
            :
          else
            git fetch --quiet origin "+refs/pull/${NUMBER}/head:refs/remotes/pr-head"
          fi
          sha=$(git rev-parse refs/remotes/pr-head)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Shared with the /auto-rebase skill, which owns the prediction logic —
          # see .claude/skills/auto-rebase/SKILL.md step 2. --json selects the
          # machine-readable mode. It exits 1 when a conflict is found, which is a
          # finding rather than an error here.
          chmod +x .claude/skills/auto-rebase/scripts/check-conflicts.sh
          set +e
          printf '%s\t%s\t%s\n' "$NUMBER" "$HEAD_REF" "$sha" \
            | BASE_REF=origin/master \
              .claude/skills/auto-rebase/scripts/check-conflicts.sh --json > /tmp/result.jsonl
          rc=$?
          set -e
          # 0 = clean, 1 = conflicts found (a finding, not an error). Anything else
          # means the check itself could not run, and must fail the job rather than
          # be read as "no conflicts".
          [ "$rc" -le 1 ] || { echo "::error::conflict check failed (exit $rc)"; exit "$rc"; }
          cat /tmp/result.jsonl

          echo "status=$(jq -r .status /tmp/result.jsonl)" >> "$GITHUB_OUTPUT"
          echo "file-count=$(jq -r '.fileCount // 0' /tmp/result.jsonl)" >> "$GITHUB_OUTPUT"
          echo "ahead=$(git rev-list --count origin/master..refs/remotes/pr-head)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebase
        id: decide
        env:
          STATUS: ${{ steps.check.outputs.status }}
          IS_FORK: ${{ matrix.pr.fork }}
          # On a push event `inputs.*` is empty, which reads as "not a dry run" — so
          # without ENABLED below the first conflicting PR after this merges would be
          # rebased and force-pushed with nobody having watched a dry run first. Set
          # repo variable CONFLICT_AUTO_REBASE to 'true' to arm it; until then every
          # run comments only. It is also the kill switch: unset the variable to stop
          # all rebasing without reverting anything.
          ENABLED: ${{ vars.CONFLICT_AUTO_REBASE }}
          DRY_RUN: ${{ inputs.dry-run }}
          AUTO_REBASE: ${{ inputs.auto-rebase }}
        run: |
          # Single place that gates every remaining step, so the conditions cannot
          # drift apart between them. Runs before the comment step so the comment
          # can state what will actually happen rather than guessing.
          rebase=true
          [ "$STATUS" = "conflict" ]   || { rebase=false; echo "no conflict — nothing to rebase"; }
          [ "$ENABLED" = "true" ]      || { rebase=false; echo "auto-rebase not armed (set repo variable CONFLICT_AUTO_REBASE=true) — comment only"; }
          [ "$IS_FORK" != "true" ]     || { rebase=false; echo "::warning::fork PR conflicts but cannot be auto-rebased (App token cannot push to fork heads)"; }
          [ "$DRY_RUN" != "true" ]     || { rebase=false; echo "dry run — skipping rebase"; }
          [ "$AUTO_REBASE" != "false" ] || { rebase=false; echo "auto-rebase disabled for this run"; }
          echo "rebase=$rebase" >> "$GITHUB_OUTPUT"

      - name: Comment on conflict
        if: steps.check.outputs.status != 'unknown'
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PR: ${{ matrix.pr.number }}
          BRANCH: ${{ matrix.pr.head }}
          # Reuse the decide step's verdict rather than recomputing the conditions
          # here — two copies would drift and the comment would promise a rebase
          # that never runs.
          WILL_REBASE: ${{ steps.decide.outputs.rebase }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- conflict-check -->';
            const dryRun = process.env.DRY_RUN === 'true';
            const willRebase = process.env.WILL_REBASE === 'true';
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR);

            const r = JSON.parse(fs.readFileSync('/tmp/result.jsonl', 'utf8').trim());

            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(MARKER));

            if (r.status === 'clean') {
              if (existing) {
                core.info(`PR #${pr}: conflicts resolved, removing comment`);
                if (!dryRun) {
                  await github.rest.issues.deleteComment(
                    { owner, repo, comment_id: existing.id });
                }
              } else {
                core.info(`PR #${pr}: clean (${r.behind} behind master)`);
              }
              return;
            }

            // Signature drives the "has anything actually changed?" check, so it must
            // depend on the conflicted files and nothing else — not the base SHA, or
            // every master push would re-notify.
            const signature = `<!-- files:${r.files.join(',')} -->`;
            const truncated = r.fileCount > r.files.length
              ? `\n_…and ${r.fileCount - r.files.length} more._` : null;

            const body = [
              MARKER,
              signature,
              '## ⚠️ This PR now conflicts with `master`',
              '',
              `Merging \`master\` into this branch would conflict in **${r.fileCount} file(s)**:`,
              '',
              ...r.files.map(f => `- \`${f}\``),
              truncated,
              '',
              willRebase
                ? 'Claude is attempting a rebase now and will report back on this PR. A backup of the pre-rebase head is pushed to `backup/rebase/' + process.env.BRANCH + '` first, so nothing is lost either way.'
                : 'Nothing has been changed on your branch. Rebase with `/auto-rebase` locally, or `git fetch origin && git rebase origin/master`.',
              '',
              willRebase
                ? 'If you have local work on this branch, wait for the result before pushing — the rebase force-pushes, so you will need to `git fetch` and reset afterwards.'
                : null,
              '_Re-checked automatically on every push to `master`._',
            ].filter(l => l !== null).join('\n');

            if (existing?.body?.includes(signature)) {
              core.info(`PR #${pr}: same conflicts as before, not re-notifying`);
              return;
            }

            core.warning(
              `PR #${pr} (${process.env.BRANCH}): conflicts in ${r.fileCount} file(s) — ${r.files.join(', ')}`);
            if (dryRun) return;

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: pr, body });
            }

      - name: Check out PR branch and back it up
        id: pre
        if: steps.decide.outputs.rebase == 'true'
        env:
          HEAD_REF: ${{ matrix.pr.head }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git checkout -B "$HEAD_REF" refs/remotes/pr-head
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Remote backup, not just a local tag: this runner is discarded, so a
          # local-only backup would be worthless if the rebase went wrong.
          # Pushed to an authenticated URL rather than via `remote set-url`, so the
          # token is never written to .git/config for Claude to find.
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/backup/rebase/${HEAD_REF}"
          echo "Backed up $(git rev-parse --short HEAD) to backup/rebase/${HEAD_REF}"

      - name: Enable Corepack
        if: steps.decide.outputs.rebase == 'true'
        run: corepack enable

      - name: Setup Node.js
        if: steps.decide.outputs.rebase == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Configure AWS credentials
        if: steps.decide.outputs.rebase == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::313941174580:role/HMCTSClaudeGitHubActionsRole
          aws-region: eu-west-1

      - name: Run Claude Code - Rebase
        id: claude
        if: steps.decide.outputs.rebase == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'eu.anthropic.claude-opus-5'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'eu.anthropic.claude-sonnet-5'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
        with:
          use_bedrock: "true"
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Rebase this branch onto origin/master, resolving the conflicts.

            REPO: ${{ github.repository }}
            PR: ${{ matrix.pr.number }}
            BRANCH: ${{ matrix.pr.head }}
            COMMITS TO REPLAY: ${{ steps.check.outputs.ahead }}
            CONFLICTING FILES: ${{ steps.check.outputs.file-count }}
            PRE_REBASE_HEAD: ${{ steps.pre.outputs.head }}

            The procedure is in .claude/skills/auto-rebase/SKILL.md — read it first and
            follow it, with these overrides because no human is present:

            - Skip steps 1-4. The branch is checked out, origin/master is fetched, and
              the backup already exists at backup/rebase/${{ matrix.pr.head }}.
            - Do NOT ask questions. There is nobody to answer. Where the skill says to
              stop and ask, instead run `git rebase --abort` and stop. Aborting is a
              correct, expected outcome — not a failure.
            - Do NOT push. A later step pushes for you. Leave the rebase finished and
              the branch checked out.
            - Do not use --update-refs; this is a single branch.

            Resolve only conflicts you are confident about: the same change applied on
            both sides, independent edits to different parts of a file, import or
            formatting collisions, additions to different parts of a list. Abort for
            anything requiring product judgment — contradictory logic for the same
            behaviour, database schema divergence, a dependency pinned to two different
            versions, or a modify/delete where you cannot tell which side should win.

            Abort also when master has already solved the same problem a different way,
            even though the conflict itself looks mechanical. Ask what capability this
            branch adds, then check whether master now provides it by other means. If it
            does, the branch is superseded and merging the two sides produces a working
            tree with two competing implementations — a decision for the author, not a
            resolution. Signals: the branch adds a tool, hook, config file or dependency
            that master achieves with a different one; a file the branch creates has no
            counterpart on master because master put the same logic elsewhere.
            Real example: a branch adding husky pre-commit hooks while master had
            adopted lefthook. Resolving package.json by keeping both entries passes lint
            and tests, and installs two hook managers that both fight over the commit.
            State this in the report as the reason for aborting.

            For yarn.lock: never hand-merge it. Take origin/master's copy, then
            regenerate with `yarn install --mode=update-lockfile` and stage the result.

            After the rebase completes, verify before finishing (step 8 of the skill):
            - `yarn lint` and `yarn test` must pass. A clean rebase is not a correct
              one — a conflict-free merge can still break at compile time.
            - Check files that must stay in sync: for every locale pair changed by this
              rebase, `en.ts` and `cy.ts` must have identical key sets.
            If verification fails and you cannot fix it, `git rebase --abort` and stop.

            Finally write a report to /tmp/rebase-report.md: what conflicted, how you
            resolved each one, whether checks passed, and whether you aborted and why.
            Write that file whether you succeed or abort.
          # The allowlist below enumerates git subcommands rather than using
          # Bash(git:*), so "never push" is enforced by the tool gate and not only by
          # the instruction in the system prompt — `git push`, `git remote` and
          # general `git config` are simply not grantable. The workflow owns the two
          # pushes it needs (backup, and the final force-with-lease).
          claude_args: |
            --dangerously-skip-permissions
            --append-system-prompt "You are rebasing a PR branch in a GitHub Action with no human present. Read @CLAUDE.md and @.claude/skills/auto-rebase/SKILL.md. Prefix rebase commands with GIT_EDITOR=true so they cannot hang. Never push and never use --force. Aborting is always preferable to guessing at a resolution. Always write /tmp/rebase-report.md."
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(corepack:*),Bash(yarn:*),Bash(node_modules/.bin/tsc:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git add:*),Bash(git rm:*),Bash(git checkout:*),Bash(git restore:*),Bash(git rebase:*),Bash(git cherry:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git cat-file:*),Bash(git stash:*),Bash(git config user.name:*),Bash(git config user.email:*)"

      - name: Determine outcome
        id: outcome
        if: always() && steps.decide.outputs.rebase == 'true'
        env:
          PRE_HEAD: ${{ steps.pre.outputs.head }}
        run: |
          # Trust git, not the model's self-report. Resolve the rebase-state dirs via
          # --git-path rather than hardcoding .git/: in a worktree they live under
          # .git/worktrees/<name>/, and a missed mid-rebase state would force-push a
          # half-applied tree.
          if [ -d "$(git rev-parse --git-path rebase-merge)" ] \
             || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            echo "state=stuck" >> "$GITHUB_OUTPUT"
            git rebase --abort || true
          elif [ "$(git rev-parse HEAD)" = "$PRE_HEAD" ]; then
            echo "state=aborted" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor origin/master HEAD; then
            echo "state=aborted" >> "$GITHUB_OUTPUT"
          else
            echo "state=rebased" >> "$GITHUB_OUTPUT"
          fi

          echo "ahead=$(git rev-list --count origin/master..HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push rebased branch
        id: push
        if: steps.outcome.outputs.state == 'rebased'
        env:
          HEAD_REF: ${{ matrix.pr.head }}
          PRE_HEAD: ${{ steps.pre.outputs.head }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # --force-with-lease pinned to the SHA read at the start of this job: if the
          # author pushed while Claude was working, this refuses rather than clobbering.
          # The explicit <ref>:<expected-oid> form matters — the bare --force-with-lease
          # leases against the local remote-tracking ref, so any fetch between the
          # preflight read and this push silently downgrades it to a plain --force.
          git push --force-with-lease="refs/heads/${HEAD_REF}:${PRE_HEAD}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${HEAD_REF}"

          # Read by the report step: without this the report derives its heading from
          # `state`, which is set before this step runs, and would claim success on a
          # rejected push.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report on PR
        if: always() && steps.decide.outputs.rebase == 'true'
        uses: actions/github-script@v9
        env:
          STATE: ${{ steps.outcome.outputs.state }}
          PR: ${{ matrix.pr.number }}
          BRANCH: ${{ matrix.pr.head }}
          AHEAD_BEFORE: ${{ steps.check.outputs.ahead }}
          AHEAD_AFTER: ${{ steps.outcome.outputs.ahead }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR);
            const state = process.env.STATE;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let report = '';
            try { report = fs.readFileSync('/tmp/rebase-report.md', 'utf8').trim(); }
            catch { report = '_No report was produced._'; }

            const before = process.env.AHEAD_BEFORE;
            const after = process.env.AHEAD_AFTER;
            const drifted = state === 'rebased' && before && after && Number(after) > Number(before);

            // The push is the only thing that changes the PR, and it runs after
            // `state` is decided — so report on the push, not on the rebase. A lease
            // rejection (the author pushed while Claude worked) leaves the branch
            // exactly as it was, which must not read as success.
            const pushed = process.env.PUSHED === 'true';
            const succeeded = state === 'rebased' && pushed;

            const heading = succeeded
              ? '## ✅ Rebased onto `master`'
              : {
                  rebased: '## ⚠️ Rebased locally, but the push was rejected',
                  aborted: '## ⏸️ Rebase aborted — needs a human',
                  stuck: '## ⚠️ Rebase left mid-flight and was aborted',
                }[state] || '## ⚠️ Rebase failed';

            const body = [
              '<!-- conflict-check-rebase -->',
              heading,
              '',
              succeeded
                ? `Replayed ${before} commit(s). \`yarn lint\` and \`yarn test\` were run as part of the rebase — check the report below.`
                : state === 'rebased'
                  ? 'The rebase succeeded but the branch was **not** updated — the push failed its `--force-with-lease` check, which means the branch moved while Claude was working. Nothing was overwritten; rebase locally instead.'
                  : 'Your branch is **unchanged**. The conflicts need a decision Claude would not make unattended.',
              '',
              drifted ? `> ⚠️ Commit count went ${before} → ${after}. Worth a look before merging.\n` : null,
              '<details><summary>Rebase report</summary>',
              '',
              report,
              '',
              '</details>',
              '',
              succeeded
                ? `Pre-rebase head is saved at \`backup/rebase/${process.env.BRANCH}\`. If you had local work, \`git fetch\` and reset — do not merge.`
                : `Run \`/auto-rebase\` locally to resolve it yourself. Backup: \`backup/rebase/${process.env.BRANCH}\`.`,
              '',
              `[Workflow run](${runUrl})`,
            ].filter(l => l !== null).join('\n');

            await github.rest.issues.createComment(
              { owner, repo, issue_number: pr, body });
